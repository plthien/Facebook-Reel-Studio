          {
            "name": "origin",
            "in": "query",
            "required": false,
            "description": "STUDIO or IMPORTED",
            "schema": {
              "type": "string",
              "enum": [
                "STUDIO",
                "IMPORTED"
              ]
            }
          },
          {
            "name": "from",
            "in": "query",
            "required": false,
            "description": "UTC date",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "to",
            "in": "query",
            "required": false,
            "description": "UTC date",
            "schema": {
              "type": "string",
              "format": "date"
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "description": "Allowlisted stable global sort before filter-bound cursor; ties resolved by internal UUID",
            "schema": {
              "type": "string",
              "enum": [
                "posted_at_desc"
              ],
              "default": "posted_at_desc"
            }
          },
          {
            "name": "metric_sort",
            "in": "query",
            "required": false,
            "description": "DEFERRED: do not enable until provider P0 capability and P2 comparable Reel-level snapshot metrics verified",
            "schema": {
              "type": "string"
            },
            "deprecated": true
          },
