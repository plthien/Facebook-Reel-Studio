    "/media": {
      "get": {
        "summary": "List media assets (P1 EXTEND)",
        "parameters": [
          {
            "name": "q",
            "in": "query",
            "required": false,
            "description": "Filename, local ID, indexed variant title",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "tag",
            "in": "query",
            "required": false,
            "description": "Variant tag",
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "validation_status",
            "in": "query",
            "required": false,
            "description": "PENDING/VALID/INVALID/ERROR/REQUIRES_TEST",
            "schema": {
              "type": "string",
              "enum": [
                "PENDING",
                "VALID",
                "INVALID",
                "ERROR",
                "REQUIRES_TEST"
              ]
            }
          },
          {
            "name": "sort",
            "in": "query",
            "required": false,
            "description": "Allowlisted stable sort",
            "schema": {
              "type": "string",
              "enum": [
                "created_at_desc",
                "created_at_asc",
                "filename_asc"
              ]
            }
          },
          {
            "name": "limit",
            "in": "query",
            "required": false,
            "description": "25 / 50 / 100",
            "schema": {
              "type": "integer",
              "enum": [
                25,
                50,
                100
              ],
              "default": 50
            }
          },
          {
            "name": "cursor",
            "in": "query",
            "required": false,
            "description": "Opaque filter/sort-bound cursor",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Stable opaque-cursor page",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MediaList"
                }
              }
            }
          },
          "400": {
            "description": "Structured error with target diagnostics",
