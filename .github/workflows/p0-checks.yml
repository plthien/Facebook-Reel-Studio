name: P0 Meta adapter checks
on:
  pull_request:
    paths:
      - 'services/api/**'
      - 'scripts/**'
      - 'tests/p0/**'
      - 'tests/live_meta/**'
      - 'pyproject.toml'
      - '.github/workflows/p0-checks.yml'
  push:
    branches: [feat/p0-meta-feasibility]
permissions:
  contents: read
jobs:
  non-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy services/api/app
      - run: python -m pytest -q -m 'not live_meta'
      - name: Assert publishing is disabled in ordinary CI
        run: |
          test "${RUN_META_PUBLISH_TESTS:-0}" != '1'
          python scripts/meta_probe.py publish-reel --page-id 123 --video-file absent.mp4 --dry-run
      - name: Scan P0 evidence for obvious raw secret patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('evidence/p0')
          for path in root.rglob('*'):
              if path.is_file():
                  data = path.read_text(errors='ignore').lower()
                  for phrase in ('access_token=', 'client_secret=', 'authorization: bearer ', 'authorization: oauth '):
                      assert phrase not in data, (path, phrase)
          PY

