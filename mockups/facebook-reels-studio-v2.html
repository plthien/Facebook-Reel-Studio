<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facebook Reels Studio · Large-Scale UI v2</title>
<style>
:root{--bg:#f4f6fa;--side:#101b2f;--ink:#1a2940;--muted:#78859b;--line:#e0e6ef;--blue:#4d64e8;--green:#11856a;--amber:#bf7830;--red:#ce4b61}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9daafd;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:230px;background:var(--side);color:#b2c0d5;padding:25px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{color:white;font-size:18px;font-weight:800;letter-spacing:-.5px;margin:0 12px 28px}.brand small{display:block;color:#768ba5;letter-spacing:1.4px;font-size:10px;margin-top:5px}.navgroup{font-weight:700;color:#677b96;margin:23px 12px 9px;font-size:10px;letter-spacing:1.3px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:9px;background:none;color:#b7c6d8;padding:11px 12px;text-align:left;margin:3px 0}.nav button.active{background:#2b3b5c;color:white;box-shadow:inset 3px 0 #8897ff}.nav button:hover{background:#23324d}.badge-side{margin-top:26px;border:1px solid #394862;background:#1a2a42;border-radius:11px;padding:13px;font-size:11px;color:#b8c4d5;line-height:1.6}.main{flex:1;min-width:0}.top{height:67px;background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between}.tiny{font-size:11px;color:var(--muted)}.demo{background:#fff6df;color:#9d681d;font-size:10px;padding:7px 10px;border:1px solid #ecd9a8;border-radius:7px;font-weight:800}.content{padding:25px 28px 55px;max-width:1760px;margin:auto}.header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.header h1{font-size:25px;margin:0 0 5px;letter-spacing:-.8px}.header p{margin:0;color:var(--muted)}.btn{border:1px solid #dbe1eb;background:#fff;border-radius:8px;color:#263650;padding:9px 12px;font-weight:650;white-space:nowrap}.btn.primary{color:white;background:var(--blue);border-color:var(--blue)}.btn:hover{filter:brightness(.975)}.btn.sm{font-size:11px;padding:6px 9px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.panel{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 20px #29345107}.pad{padding:18px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.kpi{padding:18px}.kpi b{font-size:28px;display:block;margin:10px 0 5px;letter-spacing:-1px}.kpi small{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:13px}.field{border:1px solid #dce3ed;border-radius:8px;background:#fff;padding:9px 11px;color:var(--ink);min-width:130px;max-width:100%}.search{width:min(300px,100%);flex:1;min-width:190px}.push{margin-left:auto}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.chip{padding:8px 12px;background:white;border:1px solid var(--line);border-radius:8px;color:#52647f}.chip.active{background:#e9edff;border-color:#afbefd;color:#3850cc;font-weight:700}.tablewrap{overflow:auto}.tbl{border-collapse:collapse;width:100%;min-width:850px}.tbl th{position:sticky;top:0;background:#f9fbfd;text-transform:uppercase;letter-spacing:.6px;font-size:10px;color:#8090a5;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:12px 14px;border-bottom:1px solid #eef1f5;font-size:12px;vertical-align:middle}.tbl tbody tr:hover{background:#fafbff}.tbl tbody tr:last-child td{border:0}.titlecell{display:flex;gap:11px;align-items:center;min-width:215px}.poster{width:34px;height:47px;display:grid;place-items:center;border-radius:6px;color:white;font-size:17px;flex:none}.sub{font-size:10px;color:var(--muted);margin-top:4px}.pill{padding:5px 8px;border-radius:6px;font-size:10px;font-weight:750;background:#eef2f8;color:#677990;white-space:nowrap}.pill.ok{background:#e2f6ef;color:#16836b}.pill.warn{background:#fff1db;color:#b27629}.pill.bad{background:#ffebef;color:#cb4e61}.pager{padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);gap:10px}.metric{font-variant-numeric:tabular-nums;font-weight:760}.note{padding:13px 15px;border-radius:9px;background:#edf2ff;border:1px solid #dbe5ff;color:#475e8e;line-height:1.55;margin:0 0 15px}.danger{background:#fff7ed;border-color:#f5ddbc;color:#986124}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.split{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px}.sectiontitle{font-weight:800;font-size:15px;margin:0 0 12px}.chart{height:185px;border-radius:10px;background:repeating-linear-gradient(to top,#eef2f7 0 1px,transparent 1px 43px);display:flex;align-items:end;gap:9px;padding:12px 13px}.bar{background:linear-gradient(0deg,#7f8ef5,#b7c4ff);border-radius:4px 4px 0 0;flex:1}.barsmall{font-size:10px;color:var(--muted);text-align:center;margin-top:9px}.operation{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eef1f5}.operation:last-child{border:0}.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}.vcard{padding:10px;cursor:pointer}.vcard .bigposter{height:160px;display:grid;place-items:center;font-size:40px;color:#fff;border-radius:8px}.vcard strong{display:block;margin:10px 0 4px}.detail{position:fixed;right:0;top:0;width:min(500px,100vw);height:100vh;background:white;box-shadow:-10px 0 35px #15223b33;z-index:50;overflow:auto;padding:25px}.overlay{position:fixed;inset:0;background:#12203a66;z-index:49}.detail h2{margin:5px 0 18px}.kv{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #eef1f5;padding:12px 0}.kv span{color:var(--muted)}.matrix{width:100%;border-collapse:collapse;min-width:820px}.matrix th,.matrix td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.matrix th{font-size:10px;color:var(--muted);text-transform:uppercase;background:#f8faff}.matrix input,.matrix select{width:100%;min-width:120px}.steps{display:flex;gap:9px;margin-bottom:16px}.step{padding:9px 14px;border-radius:8px;background:#e7ebf3;color:#77849a}.step.on{background:#e9edff;color:#3e54d0;font-weight:750}.mode{padding:13px;cursor:pointer;border:1px solid #dce3ee;border-radius:10px;min-width:190px;flex:1}.mode.active{border-color:#8798f7;background:#f3f5ff}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.count{font-size:11px;background:#edf1fc;border-radius:20px;padding:5px 9px}.muted{color:var(--muted)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:1px solid var(--line);border-radius:7px;padding:10px;background:white;min-height:76px}.day b{display:block}.day small{color:var(--muted)}.agendafilter{max-width:100%}.tall{min-height:320px}.tabs{display:flex;gap:6px}.notice{font-size:11px;color:var(--muted);margin-top:14px}.hidden{display:none!important}
@media(max-width:1100px){.sidebar{width:70px;padding:20px 8px}.brand{font-size:15px;margin:0 0 25px;text-align:center}.brand small,.nav button span,.navgroup,.badge-side{display:none}.nav button{justify-content:center}.kpis{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.content{padding:20px}}@media(max-width:650px){.sidebar{width:53px}.top{padding:0 12px}.content{padding:15px}.header{align-items:start;flex-direction:column}.cols{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:21px}.steps{flex-wrap:wrap}.day{min-height:70px;padding:5px}}
</style></head><body><div id="app"></div>
<script>
const PA=['Drama Gia Đình','Bé Xinh Mỗi Ngày','Chuyện Công Sở','Góc Mẹ Bỉm','Chuyện Hàng Xóm','Nhà Có Hai Bé','Outfit Bé Yêu','Tâm Sự Nàng Dâu'];
const groups=['Drama','Thời trang','Gia đình'];const c=['#c89cab','#86a9d4','#b0a0d5','#8cc9bc','#e2b789','#aaa9cf'];
const pages=Array.from({length:50},(_,i)=>({id:'p'+(i+1),name:i<8?PA[i]:groups[i%3]+' Studio '+String(i+1).padStart(2,'0'),group:groups[i%3],status:i%17===0?'BLOCKED_AUTH':'ACTIVE',reels:100+i*13,code:String(8130000000000000+i)}));
const assets=Array.from({length:10000},(_,i)=>({id:'a'+(i+1),title:['Drama mẹ chồng','Outfit trẻ em','Chuyện công sở','Mèo và em bé','Chuyện hàng xóm'][i%5]+' — Tập '+String(Math.floor(i/5)+1).padStart(4,'0'),theme:groups[i%3],usage:i%11,valid:i%41===0?'INVALID':'VALID',date:'2026-10-'+String((i%15)+1).padStart(2,'0'),emoji:['🎭','👗','☕','🐱','🏘️'][i%5],color:c[i%6]}));
const reels=Array.from({length:100000},(_,i)=>({id:'r'+(i+1),asset:i%10000,page:i%50,views:i%37===0?null:Math.floor(410+i*14.9+(i%51)*270),origin:i%4===0?'IMPORTED':'STUDIO',date:'2026-10-'+String((i%15)+1).padStart(2,'0'),sync:'15/10 12:05'}));
const jobs=Array.from({length:100000},(_,i)=>({id:'JOB-'+(100000+i),asset:i%10000,page:i%50,status:['SCHEDULED','PUBLISHED','PUBLISHED','FAILED','UNCERTAIN','BLOCKED_AUTH'][i%6],date:'2026-10-'+String((i%15)+16).padStart(2,'0')+'T19:30'}));
const state={screen:'dashboard',query:'',filter:'all',view:'list',size:25,page:1,selected:new Set(),selectionScope:false,drawer:null,period:'7',pageFilter:'all',calendar:'agenda',step:1,mode:'quick',composerAssets:['a1'],composerPages:['p2','p3'],drafts:{},schedule:'2026-10-20T19:30',preview:false,sort:'recent',metric:'views',jobState:'all',show:'reel'};
const icons={dashboard:'◫',pages:'▤',library:'▧',publish:'▸',calendar:'▦',reels:'▣',analytics:'▥',activity:'◷',settings:'⚙'};
const nav=[['dashboard','Tổng quan'],['pages','Fanpages'],['library','Video Library'],['publish','Đăng Reels'],['calendar','Lịch đăng'],['reels','Reels'],['analytics','Analytics'],['activity','Hoạt động'],['settings','Cài đặt']];
function e(v){return String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','"':'&quot;'}[x]))}
function money(v){return v==null?'N/A':v>=1000000?(v/1000000).toFixed(2)+'M':v>=1000?(v/1000).toFixed(1)+'K':String(v)}
function setScreen(x){state.screen=x;state.query='';state.page=1;state.selected.clear();state.selectionScope=false;state.drawer=null;location.hash=x;draw()}
function q(v){state.query=v;state.page=1;drawKeepFocus()}function setFilter(v){state.filter=v;state.page=1;state.selected.clear();draw()}function setSize(v){state.size=Number(v);state.page=1;draw()}
function pager(total){let p=Math.max(1,Math.ceil(total/state.size));if(state.page>p)state.page=p;return '<div class="pager"><span>Hiển thị '+(total?(state.page-1)*state.size+1:0)+'–'+Math.min(total,state.page*state.size)+' trong '+total.toLocaleString('vi-VN')+' kết quả</span><div class="row"><select class="field" onchange="setSize(this.value)">'+[25,50,100].map(x=>'<option '+(state.size===x?'selected':'')+'>'+x+'</option>').join('')+'</select><button class="btn sm" '+(state.page===1?'disabled':'')+' onclick="state.page--;draw()">‹</button><span class="tiny">'+state.page+' / '+p+'</span><button class="btn sm" '+(state.page===p?'disabled':'')+' onclick="state.page++;draw()">›</button></div></div>'}
function slice(arr){return arr.slice((state.page-1)*state.size,state.page*state.size)}
function heading(title,desc,action){return '<div class="header"><div><h1>'+title+'</h1><p>'+desc+'</p></div><div class="row">'+(action||'')+'</div></div>'}
function btn(label,action,primary=false){return '<button class="btn '+(primary?'primary':'')+'" onclick="'+action+'">'+label+'</button>'}
function toolbar(extra){return '<div class="toolbar"><input id="search" class="field search" placeholder="Tìm trong toàn bộ dữ liệu…" value="'+e(state.query)+'" oninput="q(this.value)" />'+(extra||'')+'</div>'}
function pill(s){return '<span class="pill '+((/ACTIVE|VALID|PUBLISHED/.test(s))?'ok':(/UNCERTAIN|SCHEDULED|REQUIRES/.test(s))?'warn':(/FAILED|INVALID|BLOCKED/.test(s))?'bad':'')+'">'+e(s)+'</span>'}
function thumb(a){return '<div class="poster" style="background:'+a.color+'">'+a.emoji+'</div>'}
function assetCell(a){return '<div class="titlecell">'+thumb(a)+'<div><strong>'+e(a.title)+'</strong><div class="sub">'+a.id+' · MP4 · 0:28</div></div></div>'}
function selectRow(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);draw()}
function bulkBar(total){return '<div class="toolbar"><strong>Đã chọn '+state.selected.size+' dòng</strong><span class="tiny">Lựa chọn được giữ qua các trang đang lọc (demo)</span>'+btn('Chọn 50 dòng hiển thị','selectVisible()')+btn('Bỏ chọn','state.selected.clear();state.selectionScope=false;draw()')+(state.screen==='library'?btn('Tạo batch với video đã chọn','createFromSelection()',true):'')+'<label class="tiny"><input type="checkbox" '+(state.selectionScope?'checked':'')+' onchange="state.selectionScope=this.checked;draw()"> Chọn toàn bộ kết quả ('+total.toLocaleString('vi-VN')+') — yêu cầu BE selection-scope</label></div>'}
function selectVisible(){currentRows().forEach(x=>state.selected.add(x.id));draw()}
function currentRows(){return slice(filtered())}
function filtered(){const v=state.query.toLowerCase();if(state.screen==='library')return assets.filter(x=>x.title.toLowerCase().includes(v)&& (state.filter==='all'||state.filter===x.valid||state.filter===x.theme));
if(state.screen==='reels')return reels.filter(x=>(state.pageFilter==='all'||x.page===Number(state.pageFilter))&&(state.filter==='all'||x.origin===state.filter)&&(v===''||assets[x.asset].title.toLowerCase().includes(v)||x.id.includes(v)));
if(state.screen==='activity')return jobs.filter(x=>(state.jobState==='all'||x.status===state.jobState)&&(v===''||x.id.toLowerCase().includes(v)||assets[x.asset].title.toLowerCase().includes(v)));
return pages.filter(x=>x.name.toLowerCase().includes(v)&&(state.filter==='all'||x.group===state.filter||x.status===state.filter))}
function library(){const rows=filtered();let sw='<select class="field" onchange="state.view=this.value;draw()"><option value="list" '+(state.view==='list'?'selected':'')+'>☷ Danh sách</option><option value="grid" '+(state.view==='grid'?'selected':'')+'>▦ Lưới</option></select>';let f='<select class="field" onchange="setFilter(this.value)">'+['all','VALID','INVALID',...groups].map(v=>'<option value="'+v+'" '+(state.filter===v?'selected':'')+'>'+v+'</option>').join('')+'</select>'+sw;
let table='<div class="panel tablewrap"><table class="tbl"><thead><tr><th></th><th>Video asset</th><th>Trạng thái</th><th>Nhóm</th><th>Đã dùng</th><th>Ngày upload</th><th>Thao tác</th></tr></thead><tbody>'+slice(rows).map(a=>'<tr><td><input type="checkbox" '+(state.selected.has(a.id)?'checked':'')+' onchange="selectRow(\''+a.id+'\')"></td><td>'+assetCell(a)+'</td><td>'+pill(a.valid)+'</td><td>'+a.theme+'</td><td>'+a.usage+' Pages</td><td>'+a.date+'</td><td>'+btn('Chi tiết','openDetail(\''+a.id+'\',\'asset\')')+'</td></tr>').join('')+'</tbody></table>'+pager(rows.length)+'</div>';
let cards='<div class="vgrid">'+slice(rows).map(a=>'<div class="panel vcard" onclick="openDetail(\''+a.id+'\',\'asset\')"><div class="bigposter" style="background:'+a.color+'">'+a.emoji+'</div><strong>'+e(a.title)+'</strong><div class="sub">'+a.id+' · '+a.usage+' Pages</div><div style="margin-top:8px">'+pill(a.valid)+'</div><label><input type="checkbox" '+(state.selected.has(a.id)?'checked':'')+' onclick="event.stopPropagation()" onchange="selectRow(\''+a.id+'\')"> Chọn</label></div>').join('')+'</div>'+pager(rows.length);
return heading('Video Library','10.000 assets giả lập · Grid/List · thao tác hàng loạt',btn('Upload video','mockAction(\'POST /media · P1\')',true))+toolbar(f)+bulkBar(rows.length)+(state.view==='list'?table:cards)}
function pagesScreen(){const rows=filtered();const f='<select class="field" onchange="setFilter(this.value)">'+['all','ACTIVE','BLOCKED_AUTH',...groups].map(v=>'<option '+(state.filter===v?'selected':'')+' value="'+v+'">'+v+'</option>').join('')+'</select>';return heading('Quản lý Fanpages','50 Page giả lập · OAuth, quyền và trạng thái kết nối',btn('Kết nối Meta','mockAction(\'GET /auth/facebook/start · P1\')',true))+toolbar(f)+'<div class="panel tablewrap"><table class="tbl"><thead><tr><th>Page</th><th>Nhóm</th><th>Reels</th><th>Khả năng đăng</th><th>Page ID</th><th>Thao tác</th></tr></thead><tbody>'+slice(rows).map(p=>'<tr><td><strong>'+e(p.name)+'</strong></td><td>'+p.group+'</td><td>'+p.reels+'</td><td>'+pill(p.status)+'</td><td>'+p.code+'</td><td>'+btn('Health','openDetail(\''+p.id+'\',\'page\')')+'</td></tr>').join('')+'</tbody></table>'+pager(rows.length)+'</div>'}
function reelsScreen(){const rows=filtered();return heading('Published Reels','100.000 Reels mô phỏng · dữ liệu Reel-level, không cộng snapshots',btn('Sync Reels','mockAction(\'POST /pages/{id}/reels/sync · P2\')'))+toolbar('<select class="field" onchange="state.pageFilter=this.value;state.page=1;draw()"><option value="all">Tất cả Pages</option>'+pages.map((p,i)=>'<option value="'+i+'" '+(state.pageFilter===String(i)?'selected':'')+'>'+e(p.name)+'</option>').join('')+'</select><select class="field" onchange="setFilter(this.value)">'+['all','STUDIO','IMPORTED'].map(v=>'<option '+(state.filter===v?'selected':'')+'>'+v+'</option>').join('')+'</select>')+bulkBar(rows.length)+'<div class="panel tablewrap"><table class="tbl"><thead><tr><th></th><th>Reel / Asset</th><th>Page</th><th>Nguồn</th><th>Published</th><th>Views (snapshot)</th><th>Freshness</th><th></th></tr></thead><tbody>'+slice(rows).map(r=>'<tr><td><input type="checkbox" '+(state.selected.has(r.id)?'checked':'')+' onchange="selectRow(\''+r.id+'\')"></td><td>'+assetCell(assets[r.asset])+'<div class="sub">Reel '+r.id+'</div></td><td>'+e(pages[r.page].name)+'</td><td>'+pill(r.origin)+'</td><td>'+r.date+'</td><td class="metric">'+money(r.views)+'</td><td>'+r.sync+'</td><td>'+btn('Snapshot','openDetail(\''+r.id+'\',\'reel\')')+'</td></tr>').join('')+'</tbody></table>'+pager(rows.length)+'</div><div class="notice">Metric unavailable = N/A (không phải 0). Sorting nâng cao phải xử lý tại backend.</div>'}
function activity(){const rows=filtered();const statuses=['all','SCHEDULED','PUBLISHED','FAILED','UNCERTAIN','BLOCKED_AUTH'];return heading('Activity · Queue','100.000 jobs mô phỏng · trạng thái độc lập theo Page',btn('System Health','setScreen(\'settings\')'))+'<div class="note danger">UNCERTAIN không có nút retry trực tiếp. Phải reconcile trước qua <code>POST /publish-jobs/{id}/reconcile</code>.</div>'+toolbar('<select class="field" onchange="state.jobState=this.value;state.page=1;draw()">'+statuses.map(v=>'<option '+(state.jobState===v?'selected':'')+'>'+v+'</option>').join('')+'</select>')+'<div class="panel tablewrap"><table class="tbl"><thead><tr><th>Job ID</th><th>Page</th><th>Video</th><th>Lịch</th><th>Trạng thái</th><th>Chi tiết</th></tr></thead><tbody>'+slice(rows).map(j=>'<tr><td><strong>'+j.id+'</strong></td><td>'+e(pages[j.page].name)+'</td><td>'+e(assets[j.asset].title)+'</td><td>'+j.date+'</td><td>'+pill(j.status)+'</td><td>'+btn('Mở','openDetail(\''+j.id+'\',\'job\')')+'</td></tr>').join('')+'</tbody></table>'+pager(rows.length)+'</div>'}
function dashboard(){return heading('Tổng quan vận hành','Ưu tiên các việc cần xử lý trước khi xem Analytics',btn('Đăng Reel','setScreen(\'publish\')',true))+'<div class="note">Mockup chỉ sử dụng dữ liệu giả lập. Các chỉ số chỉ hiển thị nếu P0 xác minh được nguồn Meta và P2 triển khai aggregation.</div><div class="kpis">'+[['Pages đã kết nối','50','GET /pages'],['Jobs cần chú ý','13','GET /publish-jobs'],['Reels theo dõi','100.000','GET /reels'],['Views Reel-level','N/A','P0 metric gate']].map(x=>'<div class="panel kpi"><small>'+x[0]+'</small><b>'+x[1]+'</b><small>'+x[2]+'</small></div>').join('')+'</div><div class="cols"><div class="panel pad"><h3 class="sectiontitle">Action Center</h3>'+[['UNCERTAIN','Kiểm tra trước khi retry','activity'],['BLOCKED_AUTH','Page cần xác thực lại','pages'],['FAILED','Xem lỗi và manual retry an toàn','activity'],['SCHEDULED','Kiểm tra lịch sắp đăng','calendar']].map(x=>'<div class="operation"><div><b>'+x[0]+'</b><div class="sub">'+x[1]+'</div></div>'+btn('Mở','setScreen(\''+x[2]+'\')')+'</div>').join('')+'</div><div class="panel pad"><h3 class="sectiontitle">Hiệu suất (chỉ minh họa)</h3><div class="chart">'+[25,42,33,54,49,67,75,58,84,79,91,76].map(v=>'<div class="bar" style="height:'+v+'%"></div>').join('')+'</div><div class="barsmall">Delta views chỉ tính khi có snapshot đủ điều kiện</div>'+btn('Xem Analytics','setScreen(\'analytics\')')+'</div></div>'}
function analytics(){return heading('Reels Analytics','Các view hiện có phải xuất phát từ metrics đã xác minh ở P0',btn('Xuất CSV','mockAction(\'GET /analytics/export.csv · P2\')'))+'<div class="note">Không có dữ liệu Meta thực. Views tổng hiện tại ≠ views tăng trong 7 ngày. Data unavailable hiển thị N/A.</div><div class="subnav">'+['Overview','Page ranking','Metric availability'].map((x,i)=>'<button class="chip '+(state.show===String(i)?'active':'')+'" onclick="state.show=\''+i+'\';draw()">'+x+'</button>').join('')+'</div><div class="kpis">'+[['Tổng views hiện tại','N/A'],['Views tăng trong kỳ','N/A'],['Reels đo được','N/A'],['Freshness','Chưa sync']].map(x=>'<div class="panel kpi"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div><div class="cols"><div class="panel pad"><h3 class="sectiontitle">Xu hướng snapshot growth</h3><div class="chart">'+[12,23,35,25,40,47,65,43,71,62,74,87].map(x=>'<div class="bar" style="height:'+x+'%"></div>').join('')+'</div><div class="notice">Biểu đồ minh họa, không phải kết quả API.</div></div><div class="panel pad"><h3 class="sectiontitle">Phạm vi API P2</h3><div class="operation">GET /analytics/overview</div><div class="operation">GET /analytics/pages</div><div class="operation">GET /analytics/reels/{id}/timeseries</div><div class="operation">GET /analytics/metrics/availability</div></div></div>'}
function calendar(){return heading('Publishing Calendar','Agenda mặc định cho lịch dày; Week/Month dùng tổng hợp',btn('Tạo lịch mới','setScreen(\'publish\')',true))+'<div class="subnav">'+['agenda','week','month'].map(v=>'<button class="chip '+(state.calendar===v?'active':'')+'" onclick="state.calendar=\''+v+'\';draw()">'+({agenda:'Agenda',week:'Tuần',month:'Tháng'}[v])+'</button>').join('')+'</div>'+(state.calendar==='agenda'?activityCalendar():calendarCells())+'<div class="notice">Đổi lịch / hủy job yêu cầu state + version lock. Spec chưa có reschedule endpoint: v2 hiển thị lịch chỉ đọc, không kéo thả thay đổi thời gian.</div>'}
function activityCalendar(){const items=jobs.slice(1,15);return '<div class="panel tablewrap"><table class="tbl"><thead><tr><th>Thời điểm (GMT+7)</th><th>Page</th><th>Video</th><th>Trạng thái</th><th></th></tr></thead><tbody>'+items.map(j=>'<tr><td>'+j.date.replace('T',' · ')+'</td><td>'+pages[j.page].name+'</td><td>'+e(assets[j.asset].title)+'</td><td>'+pill(j.status)+'</td><td>'+btn('Job','openDetail(\''+j.id+'\',\'job\')')+'</td></tr>').join('')+'</tbody></table></div>'}
function calendarCells(){return '<div class="days">'+Array.from({length:state.calendar==='week'?7:28},(_,i)=>'<div class="day"><b>'+(i+1)+'/10</b><small>'+(i*9%37)+' lịch đăng</small><div style="margin-top:8px">'+pill(i%6===0?'UNCERTAIN':'SCHEDULED')+'</div></div>').join('')+'</div>'}
function settings(){return heading('Settings & System Health','P1 health · P3 vận hành · không hiển thị token',btn('Xem Fanpages','setScreen(\'pages\')'))+'<div class="cols"><div class="panel pad"><h3>Meta integration</h3>'+[['Graph API','v26.0 (target, P0 chưa kiểm thử)'],['OAuth scopes','Chưa xác minh'],['Page capability','GET /pages/{id}/health'],['Meta App Secret','Ẩn trên frontend']].map(x=>'<div class="kv"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><div class="panel pad"><h3>System readiness</h3>'+[['API','Chưa triển khai'],['Worker','Chưa triển khai'],['Queue','Chưa triển khai'],['Storage','Chưa triển khai'],['Timezone','Asia/Ho_Chi_Minh']].map(x=>'<div class="kv"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div></div>'}
function createFromSelection(){if(state.selectionScope){mockAction('Chọn toàn bộ kết quả qua filter token cần BE contract bổ sung; v2 không tạo batch giả');return}if(!state.selected.size){mockAction('Hãy chọn video trước');return}state.composerAssets=Array.from(state.selected).slice(0,100);state.mode='batch';state.step=1;setScreen('publish')}
function publish(){const count=state.composerAssets.length*state.composerPages.length;const modes=[['quick','Quick Publish','1 asset → nhiều Page'],['batch','Batch Publish','N assets → Page chọn thủ công']];return heading('Publish Composer','P1: single Page · P3: bulk với request targets rõ ràng',btn('Mở hàng đợi','setScreen(\'activity\')'))+'<div class="steps">'+[1,2,3].map(i=>'<span class="step '+(state.step===i?'on':'')+'">'+i+' · '+['','Nội dung','Phân bổ Pages','Rà soát'][i]+'</span>').join('')+'</div>'+(state.step===1?'<div class="panel pad"><h3 class="sectiontitle">1. Chọn chế độ</h3><div class="row">'+modes.map(x=>'<div class="mode '+(state.mode===x[0]?'active':'')+'" onclick="state.mode=\''+x[0]+'\';draw()"><strong>'+x[1]+'</strong><div class="sub">'+x[2]+'</div></div>').join('')+'</div><div class="operation"><span>Video được chọn: '+state.composerAssets.length+'</span>'+btn('Chọn từ Library','setScreen(\'library\')')+'</div><div class="operation"><span>Demo asset hiện tại: '+state.composerAssets.slice(0,6).join(', ')+(state.composerAssets.length>6?'…':'')+'</span></div>'+btn('Tiếp: Chọn Page','state.step=2;draw()',true)+'</div>':state.step===2?'<div class="panel pad"><h3 class="sectiontitle">2. Chọn Page & thiết lập thời điểm</h3><p class="muted">Chỉ Page ACTIVE; bảng chọn giới hạn để prototype dễ kiểm tra.</p><div class="row">'+pages.slice(0,12).filter(x=>x.status==='ACTIVE').map(p=>'<label class="chip"><input type="checkbox" '+(state.composerPages.includes(p.id)?'checked':'')+' onchange="toggleComposerPage(\''+p.id+'\')"> '+e(p.name)+'</label>').join('')+'</div><div class="operation"><label>Giờ mặc định (GMT+7)</label><input class="field" type="datetime-local" value="'+state.schedule+'" onchange="state.schedule=this.value"></div><div class="row">'+btn('Quay lại','state.step=1;draw()')+btn('Tiếp: Review matrix','state.step=3;draw()',true)+'</div></div>':publishReview(count))}
function toggleComposerPage(id){state.composerPages=state.composerPages.includes(id)?state.composerPages.filter(x=>x!==id):[...state.composerPages,id];draw()}
function publishReview(count){let targets=[];for(let a of state.composerAssets)for(let p of state.composerPages)targets.push({key:a+'|'+p,asset:assets[Number(a.slice(1))-1],page:pages[Number(p.slice(1))-1]});if(state.mode==='quick')targets=targets.filter(x=>x.asset.id===state.composerAssets[0]);let shown=targets.slice(0,40);
return '<div class="note">Review Matrix tạo một target = một (video variant, Page, thời gian) và gọi <code>POST /publish-batches/preview</code> trước submit. Nút xác nhận chỉ mô phỏng.</div><div class="panel pad"><div class="row" style="justify-content:space-between"><h3 class="sectiontitle">3. Preview Matrix · '+targets.length+' targets</h3><span class="pill warn">Không gửi Meta</span></div><div class="tablewrap"><table class="matrix"><thead><tr><th>Video</th><th>Page</th><th>Caption override</th><th>Scheduled (GMT+7)</th><th>Validation</th></tr></thead><tbody>'+shown.map(x=>'<tr><td>'+e(x.asset.title)+'</td><td>'+e(x.page.name)+'</td><td><input class="field" placeholder="Caption cho Page" value="'+e(state.drafts[x.key]||'')+'" onchange="state.drafts[\''+x.key+'\']=this.value"></td><td><input class="field" type="datetime-local" value="'+state.schedule+'" title="Demo dùng lịch chung; spec cho phép từng target override"></td><td>'+pill(x.asset.valid)+'</td></tr>').join('')+'</tbody></table></div>'+(targets.length>40?'<p class="notice">Chỉ render 40 dòng preview. Production phải paginated/virtualized để review toàn bộ '+targets.length+' targets; không được submit trước khi server validate tất cả.</p>':'')+'<div class="modalfoot">'+btn('Quay lại','state.step=2;draw()')+btn('Validate preview (demo)','mockAction(\'POST /publish-batches/preview · P1/P3\')')+btn('Xem cấu trúc submit','openDetail(\'publish\',\'contract\')',true)+'</div></div>'}
function openDetail(id,type){state.drawer={id,type};draw()}
function mockAction(msg){state.drawer={id:msg,type:'action'};draw()}
function detail(){if(!state.drawer)return '';const x=state.drawer;let body='';
if(x.type==='asset'){const a=assets[Number(x.id.slice(1))-1];body='<h2>'+e(a.title)+'</h2>'+thumb(a)+'<div class="kv"><span>Asset ID</span><b>'+a.id+'</b></div><div class="kv"><span>Validation</span>'+pill(a.valid)+'</div><div class="kv"><span>Số Pages đã sử dụng</span><b>'+a.usage+'</b></div><div class="note">Usage history by asset: cần bổ sung API mapping GET /media/{id}/publications. Không giả lập nút nếu chưa có contract.</div>'+btn('Chọn để đăng','state.composerAssets=[\''+a.id+'\'];state.mode=\'quick\';state.step=1;setScreen(\'publish\')',true)}
else if(x.type==='reel'){const r=reels[Number(x.id.slice(1))-1];body='<h2>Reel '+r.id+'</h2><div class="kv"><span>Page</span><b>'+e(pages[r.page].name)+'</b></div><div class="kv"><span>Views latest snapshot</span><b>'+money(r.views)+'</b></div><div class="kv"><span>Observed at</span><b>'+r.sync+'</b></div><div class="kv"><span>Origin</span><b>'+r.origin+'</b></div><p class="note">P2: GET /reels/{id}, GET /analytics/reels/{id}/timeseries. Chưa có Meta metric thật.</p>'}
else if(x.type==='job'){const j=jobs.find(j=>j.id===x.id);body='<h2>'+j.id+'</h2><div class="kv"><span>Trạng thái</span>'+pill(j.status)+'</div><div class="kv"><span>Page</span><b>'+pages[j.page].name+'</b></div><div class="kv"><span>Asset</span><b>'+assets[j.asset].title+'</b></div><p class="note">'+(j.status==='UNCERTAIN'?'UNCERTAIN → Reconcile bắt buộc, không retry mù.':'GET /publish-jobs/{id} trả trạng thái và attempts.')+'</p>'+btn('Xem reconcile contract','mockAction(\'POST /publish-jobs/{id}/reconcile · P1\')')}
else if(x.type==='page'){const p=pages.find(p=>p.id===x.id);body='<h2>'+e(p.name)+'</h2><div class="kv"><span>Status</span>'+pill(p.status)+'</div><div class="kv"><span>Page ID</span><b>'+p.code+'</b></div><div class="note">GET /pages/{id}/health · P1. Token không xuất hiện trong UI.</div>'}
else if(x.type==='contract'){body='<h2>API Preview / Submit</h2><p>POST /publish-batches/preview</p><p>POST /publish-batches + Idempotency-Key</p><pre style="white-space:pre-wrap;background:#f6f8fc;padding:12px">{"name":"Batch demo","targets":[{"page_id":"UUID","variant_id":"UUID","scheduled_at":"UTC ISO-8601","caption_override":"..."}]}</pre><p class="note">Demo chỉ minh họa contract. Không có API call thật. Nếu video/page invalid server phải từ chối toàn bộ batch với 422.</p>'}
else body='<h2>Chưa kết nối backend</h2><p>'+e(x.id)+'</p><div class="note">Chức năng này được thể hiện như contract, không tạo giả lập thành công.</div>';
return '<div class="overlay" onclick="state.drawer=null;draw()"></div><aside class="detail"><div class="row" style="justify-content:space-between"><span class="tiny">DETAIL / CONTRACT</span>'+btn('Đóng','state.drawer=null;draw()')+'</div>'+body+'</aside>'}
function draw(){document.getElementById('app').innerHTML='<div class="shell"><aside class="sidebar"><div class="brand">▶ Reels Studio<small>LARGE-SCALE OPERATIONS · V2</small></div><div class="nav"><div class="navgroup">NỘI DUNG</div>'+nav.slice(0,4).map(x=>'<button class="'+(state.screen===x[0]?'active':'')+'" onclick="setScreen(\''+x[0]+'\')">'+icons[x[0]]+' <span>'+x[1]+'</span></button>').join('')+'<div class="navgroup">VẬN HÀNH</div>'+nav.slice(4,8).map(x=>'<button class="'+(state.screen===x[0]?'active':'')+'" onclick="setScreen(\''+x[0]+'\')">'+icons[x[0]]+' <span>'+x[1]+'</span></button>').join('')+'<div class="navgroup">HỆ THỐNG</div>'+nav.slice(8).map(x=>'<button class="'+(state.screen===x[0]?'active':'')+'" onclick="setScreen(\''+x[0]+'\')">'+icons[x[0]]+' <span>'+x[1]+'</span></button>').join('')+'</div><div class="badge-side">P0 · API CHƯA XÁC MINH<br/>Không kết nối Meta. Không lưu token hoặc thực hiện đăng bài.</div></aside><div class="main"><header class="top"><div><strong>Workspace / '+(nav.find(x=>x[0]===state.screen)||['',''])[1]+'</strong><div class="tiny">50 Pages · 10k assets · 100k Reels · synthetic data</div></div><span class="demo">DEMO DATA · NO META API</span></header><main class="content">'+({dashboard,pages:pagesScreen,library,publish,calendar,reels:reelsScreen,analytics,activity,settings}[state.screen]||dashboard)()+'</main></div></div>'+detail();document.title='Reels Studio v2 · '+state.screen}
function drawKeepFocus(){const el=document.activeElement;const pos=el&&el.tagName==='INPUT'?el.selectionStart:null;draw();const nxt=document.getElementById('search');if(nxt&&pos!=null){nxt.focus();nxt.setSelectionRange(pos,pos)}}
const hash=location.hash.slice(1);if(nav.some(x=>x[0]===hash))state.screen=hash;draw();
document.addEventListener('keydown',x=>{if(x.key==='Escape'&&state.drawer){state.drawer=null;draw()}});
</script></body></html>
