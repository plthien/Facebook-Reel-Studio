<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Facebook Reels Studio · Large-Scale UI v2</title>
<style>
:root{--bg:#f4f6fa;--side:#101b2f;--ink:#1a2940;--muted:#78859b;--line:#e0e6ef;--blue:#4d64e8;--green:#11856a;--amber:#bf7830;--red:#ce4b61}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9daafd;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:230px;background:var(--side);color:#b2c0d5;padding:25px 14px;position:sticky;top:0;height:100vh;flex-shrink:0}.brand{color:white;font-size:18px;font-weight:800;letter-spacing:-.5px;margin:0 12px 28px}.brand small{display:block;color:#768ba5;letter-spacing:1.4px;font-size:10px;margin-top:5px}.navgroup{font-weight:700;color:#677b96;margin:23px 12px 9px;font-size:10px;letter-spacing:1.3px}.nav button{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:9px;background:none;color:#b7c6d8;padding:11px 12px;text-align:left;margin:3px 0}.nav button.active{background:#2b3b5c;color:white;box-shadow:inset 3px 0 #8897ff}.nav button:hover{background:#23324d}.badge-side{margin-top:26px;border:1px solid #394862;background:#1a2a42;border-radius:11px;padding:13px;font-size:11px;color:#b8c4d5;line-height:1.6}.main{flex:1;min-width:0}.top{height:67px;background:#fff;border-bottom:1px solid var(--line);padding:0 28px;display:flex;align-items:center;justify-content:space-between}.tiny{font-size:11px;color:var(--muted)}.demo{background:#fff6df;color:#9d681d;font-size:10px;padding:7px 10px;border:1px solid #ecd9a8;border-radius:7px;font-weight:800}.content{padding:25px 28px 55px;max-width:1760px;margin:auto}.header{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.header h1{font-size:25px;margin:0 0 5px;letter-spacing:-.8px}.header p{margin:0;color:var(--muted)}.btn{border:1px solid #dbe1eb;background:#fff;border-radius:8px;color:#263650;padding:9px 12px;font-weight:650;white-space:nowrap}.btn.primary{color:white;background:var(--blue);border-color:var(--blue)}.btn:hover{filter:brightness(.975)}.btn.sm{font-size:11px;padding:6px 9px}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.panel{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:0 5px 20px #29345107}.pad{padding:18px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px;margin-bottom:18px}.kpi{padding:18px}.kpi b{font-size:28px;display:block;margin:10px 0 5px;letter-spacing:-1px}.kpi small{color:var(--muted)}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:white;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:13px}.field{border:1px solid #dce3ed;border-radius:8px;background:#fff;padding:9px 11px;color:var(--ink);min-width:130px;max-width:100%}.search{width:min(300px,100%);flex:1;min-width:190px}.push{margin-left:auto}.subnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.chip{padding:8px 12px;background:white;border:1px solid var(--line);border-radius:8px;color:#52647f}.chip.active{background:#e9edff;border-color:#afbefd;color:#3850cc;font-weight:700}.tablewrap{overflow:auto}.tbl{border-collapse:collapse;width:100%;min-width:850px}.tbl th{position:sticky;top:0;background:#f9fbfd;text-transform:uppercase;letter-spacing:.6px;font-size:10px;color:#8090a5;text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}.tbl td{padding:12px 14px;border-bottom:1px solid #eef1f5;font-size:12px;vertical-align:middle}.tbl tbody tr:hover{background:#fafbff}.tbl tbody tr:last-child td{border:0}.titlecell{display:flex;gap:11px;align-items:center;min-width:215px}.poster{width:34px;height:47px;display:grid;place-items:center;border-radius:6px;color:white;font-size:17px;flex:none}.sub{font-size:10px;color:var(--muted);margin-top:4px}.pill{padding:5px 8px;border-radius:6px;font-size:10px;font-weight:750;background:#eef2f8;color:#677990;white-space:nowrap}.pill.ok{background:#e2f6ef;color:#16836b}.pill.warn{background:#fff1db;color:#b27629}.pill.bad{background:#ffebef;color:#cb4e61}.pager{padding:14px 16px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;color:var(--muted);gap:10px}.metric{font-variant-numeric:tabular-nums;font-weight:760}.note{padding:13px 15px;border-radius:9px;background:#edf2ff;border:1px solid #dbe5ff;color:#475e8e;line-height:1.55;margin:0 0 15px}.danger{background:#fff7ed;border-color:#f5ddbc;color:#986124}.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.split{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:16px}.sectiontitle{font-weight:800;font-size:15px;margin:0 0 12px}.chart{height:185px;border-radius:10px;background:repeating-linear-gradient(to top,#eef2f7 0 1px,transparent 1px 43px);display:flex;align-items:end;gap:9px;padding:12px 13px}.bar{background:linear-gradient(0deg,#7f8ef5,#b7c4ff);border-radius:4px 4px 0 0;flex:1}.barsmall{font-size:10px;color:var(--muted);text-align:center;margin-top:9px}.operation{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #eef1f5}.operation:last-child{border:0}.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:14px}.vcard{padding:10px;cursor:pointer}.vcard .bigposter{height:160px;display:grid;place-items:center;font-size:40px;color:#fff;border-radius:8px}.vcard strong{display:block;margin:10px 0 4px}.detail{position:fixed;right:0;top:0;width:min(500px,100vw);height:100vh;background:white;box-shadow:-10px 0 35px #15223b33;z-index:50;overflow:auto;padding:25px}.overlay{position:fixed;inset:0;background:#12203a66;z-index:49}.detail h2{margin:5px 0 18px}.kv{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #eef1f5;padding:12px 0}.kv span{color:var(--muted)}.matrix{width:100%;border-collapse:collapse;min-width:820px}.matrix th,.matrix td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.matrix th{font-size:10px;color:var(--muted);text-transform:uppercase;background:#f8faff}.matrix input,.matrix select{width:100%;min-width:120px}.steps{display:flex;gap:9px;margin-bottom:16px}.step{padding:9px 14px;border-radius:8px;background:#e7ebf3;color:#77849a}.step.on{background:#e9edff;color:#3e54d0;font-weight:750}.mode{padding:13px;cursor:pointer;border:1px solid #dce3ee;border-radius:10px;min-width:190px;flex:1}.mode.active{border-color:#8798f7;background:#f3f5ff}.modalfoot{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.count{font-size:11px;background:#edf1fc;border-radius:20px;padding:5px 9px}.muted{color:var(--muted)}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{border:1px solid var(--line);border-radius:7px;padding:10px;background:white;min-height:76px}.day b{display:block}.day small{color:var(--muted)}.agendafilter{max-width:100%}.tall{min-height:320px}.tabs{display:flex;gap:6px}.notice{font-size:11px;color:var(--muted);margin-top:14px}.hidden{display:none!important}
@media(max-width:1100px){.sidebar{width:70px;padding:20px 8px}.brand{font-size:15px;margin:0 0 25px;text-align:center}.brand small,.nav button span,.navgroup,.badge-side{display:none}.nav button{justify-content:center}.kpis{grid-template-columns:repeat(2,1fr)}.split{grid-template-columns:1fr}.content{padding:20px}}@media(max-width:650px){.sidebar{width:53px}.top{padding:0 12px}.content{padding:15px}.header{align-items:start;flex-direction:column}.cols{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:21px}.steps{flex-wrap:wrap}.day{min-height:70px;padding:5px}}
</style></head><body><div id="app"></div>
<script>

'use strict';
// DESIGN ONLY. Deterministic lazy fixtures are not production API implementation.
const GROUPS=['Drama','Thời trang','Gia đình'];
const COLORS=['#c89cab','#86a9d4','#b0a0d5','#8cc9bc','#e2b789','#aaa9cf'];
const PAGE_NAMES=['Drama Gia Đình','Bé Xinh Mỗi Ngày','Chuyện Công Sở','Góc Mẹ Bỉm','Chuyện Hàng Xóm','Nhà Có Hai Bé','Outfit Bé Yêu','Tâm Sự Nàng Dâu'];
const pages=Array.from({length:50},(_,i)=>({id:'p'+(i+1),name:PAGE_NAMES[i]||GROUPS[i%3]+' Studio '+String(i+1).padStart(2,'0'),group:GROUPS[i%3],status:i%17===0?'BLOCKED_AUTH':i%19===0?'EXPIRED':'ACTIVE',code:String(8130000000000000+i)}));
const LIMITS={library:10000,reels:100000,activity:100000,pages:50};
function assetAt(i){return {id:'a'+(i+1),title:['Drama mẹ chồng','Outfit trẻ em','Chuyện công sở','Mèo và em bé','Chuyện hàng xóm'][i%5]+' — Tập '+String(Math.floor(i/5)+1).padStart(4,'0'),tag:GROUPS[i%3],valid:i%41===0?'INVALID':i%43===0?'REQUIRES_TEST':'VALID',date:'2026-10-'+String((i%15)+1).padStart(2,'0'),emoji:['🎭','👗','☕','🐱','🏘️'][i%5],color:COLORS[i%6],usage:i%11};}
function reelAt(i){return {id:'r'+(i+1),asset:i%10000,page:i%50,views:i%37===0?null:i%47===0?0:Math.floor(410+i*14.9+(i%51)*270),origin:i%4===0?'IMPORTED':'STUDIO',date:'2026-10-'+String((i%15)+1).padStart(2,'0'),sync:i%11===0?'2026-10-10T05:05:00Z':'2026-10-15T05:05:00Z'};}
function jobAt(i){return {id:'JOB-'+(100000+i),asset:i%10000,page:i%50,status:['SCHEDULED','PUBLISHED','PUBLISHED','FAILED','UNCERTAIN','BLOCKED_AUTH'][i%6],date:'2026-10-'+String((i%15)+16).padStart(2,'0')+'T19:30'};}
const generators={library:assetAt,reels:reelAt,activity:jobAt,pages:i=>pages[i]};
const icons={dashboard:'◫',pages:'▤',library:'▧',publish:'▸',calendar:'▦',reels:'▣',analytics:'▥',activity:'◷',settings:'⚙'};
const nav=[['dashboard','Tổng quan'],['pages','Fanpages'],['library','Video Library'],['publish','Đăng Reels'],['calendar','Lịch đăng'],['reels','Reels'],['analytics','Analytics'],['activity','Hoạt động'],['settings','Cài đặt']];
const state={screen:'dashboard',query:'',filter:'all',pageFilter:'all',sort:'recent',dateFrom:'',dateTo:'',view:'list',size:25,cursor:0,history:[],selected:new Set(),drawer:null,mode:'quick',step:1,composerAssets:['a2'],composerPages:['p2','p3'],targets:[],nextTarget:1,reviewPage:0,schedule:'2026-10-20T19:30',calendar:'agenda',jobState:'all',tab:'overview',apiState:'',demoResult:'',transferError:'',validatedFingerprint:null,nowOverride:null,minLeadMinutes:10};
function e(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));}
function pill(v){let cls=/^(ACTIVE|VALID|PUBLISHED)$/.test(v)?'ok':/^(SCHEDULED|UNCERTAIN|REQUIRES_TEST)$/.test(v)?'warn':/^(INVALID|BLOCKED_AUTH|EXPIRED|FAILED)$/.test(v)?'bad':'';return '<span class="pill '+cls+'">'+e(v)+'</span>';}
function btn(label,action,primary=false,disabled=false){return '<button type="button" class="btn '+(primary?'primary':'')+'" '+(disabled?'disabled ':'')+'onclick="'+action+'">'+e(label)+'</button>';}
function heading(t,d,a){return '<div class="header"><div><h1>'+t+'</h1><p>'+d+'</p></div><div class="row">'+(a||'')+'</div></div>';}
function toolbar(extra){return '<div class="toolbar"><label class="tiny" for="search">Tìm kiếm</label><input id="search" class="field search" aria-label="Tìm kiếm" placeholder="Tên hoặc ID…" value="'+e(state.query)+'" oninput="queryChange(this.value)">'+(extra||'')+'</div>';}
function resetCursor(){state.cursor=0;state.history=[];}
function resetFilter(key,value){state[key]=value;resetCursor();draw();}
function queryChange(value){state.query=value;state.cursor=0;state.history=[];drawKeepFocus();}
function changeSize(v){state.size=Number(v);resetCursor();draw();}
function setScreen(name){state.screen=name;state.query='';state.filter='all';state.pageFilter='all';state.dateFrom='';state.dateTo='';state.cursor=0;state.history=[];state.drawer=null;location.hash=name;draw();}
function matches(kind,x){const q=state.query.trim().toLowerCase();if(kind==='library')return (state.filter==='all'||x.valid===state.filter||x.tag===state.filter)&&(!q||x.id.includes(q)||x.title.toLowerCase().includes(q));
if(kind==='pages')return (state.filter==='all'||x.status===state.filter||x.group===state.filter)&&(!q||x.name.toLowerCase().includes(q)||x.code.includes(q));
if(kind==='activity')return (state.jobState==='all'||x.status===state.jobState)&&(state.pageFilter==='all'||x.page===Number(state.pageFilter))&&(!state.dateFrom||x.date.slice(0,10)>=state.dateFrom)&&(!state.dateTo||x.date.slice(0,10)<=state.dateTo)&&(!q||x.id.toLowerCase().includes(q)||assetAt(x.asset).title.toLowerCase().includes(q));
return (state.filter==='all'||x.origin===state.filter)&&(state.pageFilter==='all'||x.page===Number(state.pageFilter))&&(!state.dateFrom||x.date>=state.dateFrom)&&(!state.dateTo||x.date<=state.dateTo)&&(!q||x.id.toLowerCase().includes(q)||(x.origin==='STUDIO'&&assetAt(x.asset).title.toLowerCase().includes(q)));}
function listData(kind){const out=[];const length=LIMITS[kind];let cursor=state.cursor;const gen=generators[kind];while(cursor<length&&out.length<state.size+1){const x=gen(cursor++);if(matches(kind,x))out.push(x);}
const hasMore=out.length>state.size;return {rows:out.slice(0,state.size),next:hasMore?cursor-1:cursor,hasMore};}
function nextPage(){const d=listData(state.screen);if(!d.hasMore)return;state.history.push(state.cursor);state.cursor=d.next;draw();}
function prevPage(){if(!state.history.length)return;state.cursor=state.history.pop();draw();}
function pager(data){return '<div class="pager"><span>Trang '+(state.history.length+1)+' · '+data.rows.length+' bản ghi · cursor giả lập (không có tổng trang API)</span><div class="row"><label class="tiny">Dòng/trang <select class="field" aria-label="Dòng mỗi trang" onchange="changeSize(this.value)">'+[25,50,100].map(n=>'<option value="'+n+'" '+(state.size===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'+btn('‹ Trước','prevPage()',false,!state.history.length)+btn('Tiếp ›','nextPage()',false,!data.hasMore)+'</div></div>';}
function thumb(a){return '<div class="poster" style="background:'+a.color+'">'+a.emoji+'</div>';}
function assetCell(a){return '<div class="titlecell">'+thumb(a)+'<div><strong>'+e(a.title)+'</strong><div class="sub">'+a.id+' · MP4 · demo variant</div></div></div>';}
function emptyRow(col){return '<tr><td colspan="'+col+'" class="muted" style="padding:30px;text-align:center">Không có dữ liệu phù hợp · trạng thái EMPTY (demo)</td></tr>';}
function selRow(id){state.selected.has(id)?state.selected.delete(id):state.selected.add(id);state.transferError='';draw();}
function selectVisible(){const current=listData(state.screen).rows;for(const x of current){state.selected.add(x.id);}state.transferError='';draw();}
function bulkBar(kind){return '<div class="toolbar"><strong>Đã chọn '+state.selected.size+' ID</strong><small class="tiny">Chỉ ID được tải trên các trang đã xem; không chọn tất cả kết quả</small>'+btn('Chọn trang hiện tại','selectVisible()')+btn('Bỏ chọn','state.selected.clear();draw()')+(kind==='library'?btn('Tạo batch từ lựa chọn','createFromSelection()',true):'')+'<span class="tiny">Chọn tất cả kết quả lọc: DEFER (không có BE token)</span></div>';}
function library(){const data=listData('library');const filter='<label class="tiny">Validation <select class="field" onchange="resetFilter(\'filter\',this.value)">'+['all','VALID','INVALID','REQUIRES_TEST',...GROUPS].map(v=>'<option '+(state.filter===v?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label class="tiny">Hiển thị <select class="field" aria-label="Chế độ hiển thị" onchange="state.view=this.value;draw()"><option value="list" '+(state.view==='list'?'selected':'')+'>Danh sách</option><option value="grid" '+(state.view==='grid'?'selected':'')+'>Lưới</option></select></label>';
const row=(a)=>'<tr><td><input type="checkbox" aria-label="Chọn '+a.id+'" '+(state.selected.has(a.id)?'checked':'')+' onchange="selRow(\''+a.id+'\')"></td><td>'+assetCell(a)+'</td><td>'+pill(a.valid)+'</td><td>'+a.tag+'</td><td>'+a.usage+' (demo)</td><td>'+a.date+'</td><td>'+btn('Chi tiết','openDetail(\''+a.id+'\',\'asset\')')+'</td></tr>';
const table='<div class="panel tablewrap"><table class="tbl"><thead><tr><th>Chọn</th><th>Video asset</th><th>Validation</th><th>Tag</th><th>Usage*</th><th>Upload</th><th>Chi tiết</th></tr></thead><tbody>'+(data.rows.length?data.rows.map(row).join(''):emptyRow(7))+'</tbody></table>'+pager(data)+'</div>';
const grid='<div class="vgrid">'+data.rows.map(a=>'<div class="panel vcard"><div class="bigposter" style="background:'+a.color+'">'+a.emoji+'</div><strong>'+e(a.title)+'</strong><div class="sub">'+a.id+' · '+a.tag+'</div>'+pill(a.valid)+'<div class="row"><label><input type="checkbox" '+(state.selected.has(a.id)?'checked':'')+' onchange="selRow(\''+a.id+'\')"> Chọn</label>'+btn('Chi tiết','openDetail(\''+a.id+'\',\'asset\')')+'</div></div>').join('')+'</div>'+(!data.rows.length?'<p class="note">Không có dữ liệu phù hợp.</p>':'')+'<div class="panel">'+pager(data)+'</div>';
return heading('Video Library','10.000 asset giả lập, chỉ sinh dòng đang xem · UI mặc định List',btn('Upload video','mockAction(\'POST /media · P1\')',true))+toolbar(filter)+bulkBar('library')+(state.transferError?'<div class="note danger" role="alert">'+e(state.transferError)+'</div>':'')+(state.view==='list'?table:grid)+'<p class="notice">*Usage chỉ là fixture, production lấy GET /media/{id}/publications theo verified lineage.</p>';}
function pageSelect(key){return '<label class="tiny">Page <select class="field" onchange="resetFilter(\''+key+'\',this.value)"><option value="all">Tất cả Pages</option>'+pages.map((p,i)=>'<option value="'+i+'" '+(state[key]===String(i)?'selected':'')+'>'+e(p.name)+'</option>').join('')+'</select></label>';}
function dateControls(){return '<label class="tiny">Từ <input aria-label="Từ ngày" class="field" type="date" value="'+state.dateFrom+'" onchange="resetFilter(\'dateFrom\',this.value)"></label><label class="tiny">Đến <input aria-label="Đến ngày" class="field" type="date" value="'+state.dateTo+'" onchange="resetFilter(\'dateTo\',this.value)"></label>';}
function pagesScreen(){const data=listData('pages');return heading('Quản lý Fanpages','50 Page demo · trạng thái quyền phải do P0/P1 xác minh',btn('Kết nối Meta','mockAction(\'OAuth · P1 · chưa hoạt động\')',true))+toolbar('<select aria-label="Trạng thái hoặc nhóm Page" class="field" onchange="resetFilter(\'filter\',this.value)">'+['all','ACTIVE','BLOCKED_AUTH','EXPIRED',...GROUPS].map(v=>'<option '+(state.filter===v?'selected':'')+'>'+v+'</option>').join('')+'</select>')+'<div class="panel tablewrap"><table class="tbl"><thead><tr><th>Page</th><th>Nhóm (đề xuất)</th><th>Page Meta ID (string)</th><th>Kết nối</th><th>Health</th></tr></thead><tbody>'+(data.rows.map(p=>'<tr><td>'+e(p.name)+'</td><td>'+p.group+'</td><td>'+p.code+'</td><td>'+pill(p.status)+'</td><td>'+btn('Kiểm tra','openDetail(\''+p.id+'\',\'page\')')+'</td></tr>').join('')||emptyRow(5))+'</tbody></table>'+pager(data)+'</div>';}
function reelsScreen(){const data=listData('reels');return heading('Published Reels','100.000 Reel fixture · Imported không tự gắn với asset nội bộ',btn('Sync Reels','mockAction(\'POST /pages/{id}/reels/sync · P2\')'))+toolbar(pageSelect('pageFilter')+'<select class="field" aria-label="Nguồn Reel" onchange="resetFilter(\'filter\',this.value)">'+['all','STUDIO','IMPORTED'].map(v=>'<option '+(state.filter===v?'selected':'')+'>'+v+'</option>').join('')+'</select>'+dateControls())+'<div class="panel tablewrap"><table class="tbl"><thead><tr><th>Reel</th><th>Page</th><th>Origin</th><th>Published</th><th>Lifetime views*</th><th>Metric</th><th>Đồng bộ</th><th></th></tr></thead><tbody>'+(data.rows.map(r=>'<tr><td><b>'+r.id+'</b><div class="sub">'+(r.origin==='STUDIO'?e(assetAt(r.asset).title):'Imported · asset chưa xác định')+'</div></td><td>'+e(pages[r.page].name)+'</td><td>'+pill(r.origin)+'</td><td>'+r.date+'</td><td class="metric">'+(r.views==null?'N/A':r.views.toLocaleString('vi-VN'))+'</td><td>'+pill(r.views==null?'UNAVAILABLE':r.views===0?'ZERO':'MOCK')+'</td><td>'+e(r.sync)+(r.sync.startsWith('2026-10-10')?' · STALE':'')+'</td><td>'+btn('Snapshot','openDetail(\''+r.id+'\',\'reel\')')+'</td></tr>').join('')||emptyRow(8))+'</tbody></table>'+pager(data)+'</div><p class="notice">*LIFETIME snapshot, không phải 7-day views. Metric chưa qua P0 LIVE GATE; mọi số là MOCK.</p>';}

function findAsset(id){const n=Number(String(id).slice(1));return n>=1&&n<=10000?assetAt(n-1):null;}
function findPage(id){return pages.find(x=>x.id===id);}
function newTarget(a,p){const id='target-'+String(state.nextTarget++).padStart(5,'0');return {id,client_target_id:id,assetId:a||'',pageId:p||'',caption:'',title:'',localTime:state.schedule};}
function ensureQuick(){if(state.mode!=='quick')return;const a=state.composerAssets[0]||'a2';const prior=new Map(state.targets.filter(x=>x.id.startsWith('quick:')).map(x=>[x.id,x]));state.targets=state.composerPages.map(p=>{const id='quick:'+a+':'+p;return prior.get(id)||{...newTarget(a,p),id,client_target_id:id};});state.validatedFingerprint=null;}
function setMode(v){state.mode=v;state.step=1;state.validatedFingerprint=null;state.demoResult='';if(v==='quick'){state.targets=[];ensureQuick();}else state.targets=[];draw();}
function createFromSelection(){const chosen=[...state.selected];if(!chosen.length){state.transferError='Hãy chọn ít nhất một video trước.';draw();return;}if(chosen.length>100){state.transferError='Đã chọn '+chosen.length+' video, vượt giới hạn 100 publishing targets/batch. Không chuyển hoặc bỏ sót video nào. Hãy bỏ chọn '+(chosen.length-100)+' video hoặc chuẩn bị từng batch thủ công.';draw();return;}state.transferError='';state.composerAssets=chosen;state.targets=[];state.validatedFingerprint=null;state.mode='batch';state.step=1;setScreen('publish');}
function sample60(){state.validatedFingerprint=null;state.nextTarget=1;state.mode='batch';state.step=2;state.composerAssets=Array.from({length:20},(_,i)=>'a'+(i+2));state.composerPages=pages.filter(p=>p.status==='ACTIVE').slice(0,10).map(p=>p.id);state.targets=Array.from({length:60},(_,i)=>newTarget(state.composerAssets[i%20],state.composerPages[(i%20+Math.floor(i/20))%10]));state.reviewPage=0;state.demoResult='';draw();}
function addTarget(){if(state.mode==='quick'){state.demoResult='Quick Publisher chỉ thêm target bằng cách chọn Page.';draw();return;}if(state.targets.length>=100){state.demoResult='Giới hạn tối đa 100 target cho mỗi batch; không cắt ngầm.';draw();return;}const a=document.getElementById('add-asset')?.value||state.composerAssets[0];const p=document.getElementById('add-page')?.value||state.composerPages[0];state.targets.push(newTarget(a,p));state.validatedFingerprint=null;state.reviewPage=0;state.demoResult='';draw();}
function removeTarget(id){if(state.mode==='quick'){state.composerPages=state.composerPages.filter(p=>!state.targets.some(t=>t.id===id&&t.pageId===p));ensureQuick();}else state.targets=state.targets.filter(x=>x.id!==id);state.validatedFingerprint=null;draw();}
function changeTarget(id,key,value){if(state.mode==='quick'&&(key==='pageId'||key==='assetId'))return;const t=state.targets.find(x=>x.id===id);if(t&&t[key]!==value){t[key]=value;state.validatedFingerprint=null;state.demoResult='';const b=document.getElementById('confirm-intent');if(b)b.disabled=true;} /* No rerender during typing; state survives steps. */}
function updateDefault(v){state.schedule=v;state.validatedFingerprint=null;draw();}
function toggleQuickPage(id){state.composerPages=state.composerPages.includes(id)?state.composerPages.filter(x=>x!==id):[...state.composerPages,id];ensureQuick();state.demoResult='';draw();}
function localUtc(v){if(typeof v!=='string'||!/^\d{4}-(0[1-9]|1[0-2])-([0-2]\d|3[01])T([01]\d|2[0-3]):[0-5]\d$/.test(v))return 'INVALID';const year=Number(v.slice(0,4));if(year<2000)return 'INVALID';const ms=Date.parse(v+':00+07:00');if(!Number.isFinite(ms))return 'INVALID';const normalized=new Date(ms+7*3600000).toISOString().slice(0,16);return normalized===v?new Date(ms).toISOString():'INVALID';}
function clockNow(){return state.nowOverride==null?Date.now():state.nowOverride;}
function validateSchedule(local,nowMs=clockNow(),lead=state.minLeadMinutes){const utc=localUtc(local);if(utc==='INVALID')return {utc,errors:['SCHEDULE_INVALID']};const at=Date.parse(utc);if(at<=nowMs)return {utc,errors:['SCHEDULE_IN_PAST']};if(at<nowMs+lead*60000)return {utc,errors:['SCHEDULE_TOO_SOON']};return {utc,errors:[]};}
function intentFingerprint(){return JSON.stringify(state.targets.map((t,index)=>[index,t.id,t.assetId,t.pageId,t.title.trim(),t.caption.trim(),t.localTime]));}
function checkTargets(){const found=new Set();return state.targets.map(t=>{const a=findAsset(t.assetId),p=findPage(t.pageId),errors=[],warnings=[];if(!a||a.valid!=='VALID')errors.push(a?'ASSET_'+a.valid:'ASSET_MISSING');if(!p||p.status!=='ACTIVE')errors.push(p?'PAGE_'+p.status:'PAGE_MISSING');if(state.mode==='quick'&&!state.composerPages.includes(t.pageId))errors.push('QUICK_PAGE_MISMATCH');if(state.mode==='quick'&&t.assetId!==state.composerAssets[0])errors.push('QUICK_ASSET_MISMATCH');const schedule=validateSchedule(t.localTime);errors.push(...schedule.errors);const utc=schedule.utc;const sig=JSON.stringify([t.pageId,t.assetId,utc,t.title.trim(),t.caption.trim()]);if(found.has(sig))errors.push('DUPLICATE_INTENT');found.add(sig);return {target:t,asset:a,page:p,utc,errors,warnings,ok:!errors.length};});}
function counts(rows){return {total:rows.length,valid:rows.filter(x=>x.ok).length,warnings:rows.filter(x=>x.warnings.length).length,invalid:rows.filter(x=>!x.ok).length,assets:new Set(rows.map(x=>x.target.assetId)).size,pages:new Set(rows.map(x=>x.target.pageId)).size};}
function stepTo(n){if(n===3){ensureQuick();state.reviewPage=0;}state.step=n;draw();}
function publish(){if(state.mode==='quick'&&!state.targets.length)ensureQuick();const modes='<div class="row">'+[['quick','Quick Publish','1 video → Pages được chọn'],['batch','Batch Publish','Mỗi mục là 1 assignment rõ ràng']].map(x=>'<button class="mode '+(state.mode===x[0]?'active':'')+'" onclick="setMode(\''+x[0]+'\')"><b>'+x[1]+'</b><div class="sub">'+x[2]+'</div></button>').join('')+'</div>';
const steps='<div class="steps">'+['Chọn nội dung','Gán target','Xem toàn bộ & xác nhận'].map((x,i)=>'<span class="step '+(state.step===i+1?'on':'')+'">'+(i+1)+'. '+x+'</span>').join('')+'</div>';
let content='';if(state.step===1){content='<div class="panel pad"><h3>1. Chọn chế độ và video</h3>'+modes+'<div class="operation">Video đang chọn: '+(state.mode==='quick'?Math.min(1,state.composerAssets.length):state.composerAssets.length)+' · '+e((state.mode==='quick'?state.composerAssets.slice(0,1):state.composerAssets.slice(0,10)).join(', '))+'</div><p>Chọn video từ Library hoặc nạp bộ kiểm thử mẫu. Không tự tạo N×M targets.</p>'+btn('Mở Video Library','setScreen(\'library\')')+btn('Nạp demo: 20 videos · 10 Pages · 60 targets','sample60()',true)+'<div class="modalfoot">'+btn('Tiếp','stepTo(2)',true)+'</div></div>';}
else if(state.step===2){const assetOpts=state.composerAssets.map(id=>'<option value="'+id+'">'+e(findAsset(id)?.title||id)+'</option>').join('');const pageOpts=pages.map(p=>'<option value="'+p.id+'">'+e(p.name)+(p.status!=='ACTIVE'?' · '+p.status:'')+'</option>').join('');
content='<div class="panel pad"><h3>2. Phân bổ thực tế · '+state.targets.length+' assignments</h3>'+(state.demoResult?'<div role="alert" class="note danger">'+e(state.demoResult)+'</div>':'')+'<p class="note">Không tự nhân '+state.composerAssets.length+' videos × '+state.composerPages.length+' Pages. Mỗi lần nhấn “Thêm target” chỉ sinh đúng 1 assignment. Cùng 1 Page có thể nhận nhiều video.</p><div class="row">'+(state.mode==='batch'?'<label>Video <select id="add-asset" class="field">'+assetOpts+'</select></label><label>Page <select id="add-page" class="field">'+pageOpts+'</select></label>'+btn('Thêm target','addTarget()',true):'<span class="tiny">Quick: thêm hoặc bỏ target qua ô chọn Page.</span>')+'</div>'+(state.mode==='quick'?'<div class="operation"><b>Quick: chọn Page (tạo đúng 1 target mỗi Page)</b></div><div class="row">'+pages.filter(p=>p.status==='ACTIVE').slice(0,12).map(p=>'<label class="chip"><input type="checkbox" '+(state.composerPages.includes(p.id)?'checked':'')+' onchange="toggleQuickPage(\''+p.id+'\')">'+e(p.name)+'</label>').join('')+'</div>':'')+'<div class="operation"><label>Giờ mặc định GMT+7 <input class="field" type="datetime-local" value="'+e(state.schedule)+'" onchange="updateDefault(this.value)"></label><span class="tiny">Giờ của từng target không bị ghi đè khi thay đổi default.</span></div><div class="tablewrap"><table class="matrix"><thead><tr><th>ID bền vững</th><th>Video</th><th>Page</th><th>Local GMT+7</th><th></th></tr></thead><tbody>'+state.targets.slice(0,25).map(t=>'<tr><td>'+e(t.id)+'</td><td>'+e(t.assetId)+'</td><td>'+e(findPage(t.pageId)?.name||'—')+'</td><td>'+e(t.localTime)+'</td><td>'+btn('Xóa','removeTarget(\''+t.id+'\')')+'</td></tr>').join('')+'</tbody></table></div><p class="notice">Bảng phân bổ xem nhanh 25 đầu; tất cả target đều được giữ trong state và hiện đầy đủ qua phân trang Review.</p><div class="modalfoot">'+btn('Quay lại','stepTo(1)')+btn('Review '+state.targets.length+' target','stepTo(3)',true)+'</div></div>';}
else content=publishReview();
return heading('Publish Composer','Preview design-only · zero API call · max 100 targets/batch',btn('Activity','setScreen(\'activity\')'))+steps+content;}
function reviewChangePage(dir){state.reviewPage+=dir;draw();}
function demoValidate(){const c=counts(checkTargets());state.validatedFingerprint=c.total>0&&c.total<=100&&!c.invalid?intentFingerprint():null;state.demoResult=c.total>100?'DEMO 422: BATCH_LIMIT_EXCEEDED':!c.total?'DEMO 422: EMPTY_TARGETS':c.invalid?'DEMO 422: '+c.invalid+' invalid target(s); zero jobs created':'DEMO VALIDATION ONLY: '+c.total+' targets kiểm tra, zero jobs created';draw();}
function showApi(v){state.apiState=v;draw();}
function confirmDemo(){const c=counts(checkTargets());if(c.total<1||c.total>100||c.invalid){state.demoResult='DEMO BLOCKED: invalid/empty/>100, không tạo job.';}else if(state.validatedFingerprint!==intentFingerprint()){state.demoResult='DEMO BLOCKED: intent đã thay đổi/chưa preview validate. Cần validate lại tất cả targets.';}else state.demoResult='DEMO ONLY: đã xác nhận intent '+c.total+' targets; 0 jobs được tạo, không gửi API/Meta.';draw();}
function publishReview(){const reviews=checkTargets(),c=counts(reviews),maxPage=Math.max(0,Math.ceil(c.total/25)-1);state.reviewPage=Math.min(state.reviewPage,maxPage);const shown=reviews.slice(state.reviewPage*25,(state.reviewPage+1)*25);
const metrics=[['Videos',c.assets],['Pages',c.pages],['Target jobs',c.total],['Valid',c.valid],['Warnings',c.warnings],['Invalid',c.invalid]];
return '<div class="note">Full intent = '+c.total+' explicit targets (không phải tích video × Page). Validate xét tất cả '+c.total+' target, kể cả ngoài trang hiện tại. Bảng phân trang chỉ là UI. UTC được tính từ Asia/Ho_Chi_Minh (+07:00).</div><div class="kpis">'+metrics.map(x=>'<div class="panel kpi"><small>'+x[0]+'</small><b>'+x[1]+'</b></div>').join('')+'</div>'+(c.total>100?'<div class="note danger">422 BATCH_LIMIT_EXCEEDED: '+c.total+' > 100. Không cắt và không gửi batch một phần.</div>':'')+'<div class="panel pad"><div class="row" style="justify-content:space-between"><h3>3. Review từng target · '+c.total+'</h3>'+pill('DEMO')+'</div><div class="tablewrap"><table class="matrix"><thead><tr><th>Stable ID</th><th>Video / variant</th><th>Page</th><th>Title override</th><th>Caption override</th><th>Local GMT+7</th><th>UTC</th><th>Validation</th></tr></thead><tbody>'+(shown.map(x=>'<tr><td>'+e(x.target.id)+'</td><td><select '+(state.mode==='quick'?'disabled title="Quick dùng đúng một video" ':'')+'aria-label="Video '+x.target.id+'" class="field" onchange="changeTarget(\''+x.target.id+'\',\'assetId\',this.value)">'+(state.mode==='quick'?state.composerAssets.slice(0,1):state.composerAssets).map(id=>'<option value="'+id+'" '+(x.target.assetId===id?'selected':'')+'>'+e(id)+'</option>').join('')+'</select></td><td><select '+(state.mode==='quick'?'disabled title="Page chọn tại bước 2" ':'')+'aria-label="Page '+x.target.id+'" class="field" onchange="changeTarget(\''+x.target.id+'\',\'pageId\',this.value)">'+pages.map(p=>'<option value="'+p.id+'" '+(x.target.pageId===p.id?'selected':'')+'>'+e(p.name)+'</option>').join('')+'</select></td><td><input aria-label="Title '+x.target.id+'" class="field" value="'+e(x.target.title)+'" oninput="changeTarget(\''+x.target.id+'\',\'title\',this.value)"></td><td><input aria-label="Caption '+x.target.id+'" class="field" value="'+e(x.target.caption)+'" oninput="changeTarget(\''+x.target.id+'\',\'caption\',this.value)"></td><td><input aria-label="Schedule '+x.target.id+'" type="datetime-local" class="field" value="'+e(x.target.localTime)+'" onchange="changeTarget(\''+x.target.id+'\',\'localTime\',this.value);draw()"></td><td class="tiny">'+e(x.utc)+'</td><td>'+pill(x.ok?(x.warnings.length?'WARNING':'VALID'):'INVALID')+(x.errors.length?'<div class="sub">'+e(x.errors.join(','))+'</div>':'')+(x.warnings.length?'<div class="sub">'+e(x.warnings.join(','))+'</div>':'')+'</td></tr>').join('')||emptyRow(8))+'</tbody></table></div><div class="pager"><span>Targets '+(state.reviewPage*25+1)+'–'+Math.min(c.total,(state.reviewPage+1)*25)+' / '+c.total+'</span><div class="row">'+btn('Trước','reviewChangePage(-1)',false,state.reviewPage===0)+btn('Tiếp','reviewChangePage(1)',false,state.reviewPage>=maxPage)+'</div></div><div class="row">'+btn('Mock API 409','showApi(\'409\')')+btn('Mock API 422','showApi(\'422\')')+(state.apiState?'<span role="alert" class="note danger">HTTP '+e(state.apiState)+(state.apiState==='409'?' idempotency key conflict; intent không được thay đổi':' validation lỗi theo client_target_id; zero jobs')+'</span>':'')+'</div>'+(state.demoResult?'<div role="status" class="note">'+e(state.demoResult)+'</div>':'')+'<div class="modalfoot">'+btn('Sửa assignments','stepTo(2)')+btn('Validate tất cả (demo)','demoValidate()')+('<button type="button" id="confirm-intent" class="btn primary" '+(!c.total||c.total>100||c.invalid>0||state.validatedFingerprint!==intentFingerprint()?'disabled ':'')+'onclick="confirmDemo()">Xác nhận intent (DEMO)</button>')+'</div><p class="notice">Khi production: POST /publish-batches/preview rồi POST /publish-batches với Idempotency-Key + fingerprint; tại đây KHÔNG tạo batch.</p></div>';}
function openDetail(id,type){state.drawer={id,type};draw();document.getElementById('drawer-close')?.focus();}
function closeDetail(){state.drawer=null;draw();document.getElementById('screen-title')?.focus();}
function mockAction(s){openDetail(s,'action');}
function detail(){if(!state.drawer)return '';const x=state.drawer;let body='';if(x.type==='asset'){const a=findAsset(x.id);body='<h2>'+e(a?.title||x.id)+'</h2>'+thumb(a)+'<div class="kv"><span>Validation</span>'+pill(a.valid)+'</div><p>Usage: chưa có dữ liệu verified; GET /media/{id}/publications là EXTEND (P1/P2).</p>'+btn('Chọn Quick','state.composerAssets=[\''+a.id+'\'];state.mode=\'quick\';state.targets=[];state.step=1;setScreen(\'publish\')');}
else if(x.type==='reel'){const r=reelAt(Number(x.id.slice(1))-1);body='<h2>'+r.id+'</h2><div class="kv"><span>Origin</span>'+pill(r.origin)+'</div><div class="kv"><span>Page</span>'+e(pages[r.page].name)+'</div><div class="kv"><span>Latest lifetime views</span>'+(r.views==null?'N/A':r.views)+'</div><div class="kv"><span>Source timestamp</span>'+r.sync+'</div><p>Snapshot provenance: simulated local fixture; P0 support NOT VERIFIED. Imported Reel không liên kết asset tự động.</p>';}
else if(x.type==='job'){const id=Number(x.id.slice(4))-100000,j=jobAt(id);body='<h2>'+j.id+'</h2><div class="kv"><span>Status</span>'+pill(j.status)+'</div><p>'+e(pages[j.page].name)+' · '+e(assetAt(j.asset).title)+'</p><div class="note danger">'+(j.status==='UNCERTAIN'?'Không retry. Trước hết phải reconcile từ remote IDs và bằng chứng.':'GET /publish-jobs/{id} để xem lịch sử attempts')+'</div>'+btn('Xem reconcile contract','mockAction(\'POST /publish-jobs/{id}/reconcile · DESIGN ONLY\')');}
else if(x.type==='page'){const p=findPage(x.id);body='<h2>'+e(p.name)+'</h2><div class="kv"><span>Health</span>'+pill(p.status)+'</div><div class="kv"><span>Meta ID</span>'+p.code+'</div><p>Quyền/task/scope: NOT VERIFIED. Token không đưa ra frontend.</p>';}
else body='<h2>Chức năng chưa triển khai</h2><p>'+e(x.id)+'</p><p>DEMO / CONTRACT ONLY · không gửi API hay tạo kết quả.</p>';
return '<div class="overlay" onclick="closeDetail()"></div><aside class="detail" role="dialog" aria-modal="true" aria-label="Chi tiết và contract"><div class="row" style="justify-content:space-between"><span class="tiny">DETAIL · DESIGN ONLY</span><button id="drawer-close" class="btn" onclick="closeDetail()">Đóng ×</button></div>'+body+'</aside>';}
function draw(){document.getElementById('app').innerHTML='<div class="shell"><aside class="sidebar"><div class="brand">▶ Reels Studio<small>LARGE-SCALE OPERATIONS · V2</small></div><nav class="nav" aria-label="Điều hướng">'+nav.map(x=>'<button aria-label="'+e(x[1])+'" title="'+e(x[1])+'" class="'+(state.screen===x[0]?'active':'')+'" onclick="setScreen(\''+x[0]+'\')">'+icons[x[0]]+' <span>'+x[1]+'</span></button>').join('')+'</nav><div class="badge-side">P0 · CHƯA XÁC MINH<br>Không kết nối Meta, không gửi job.</div></aside><div class="main"><header class="top"><div><b>Workspace / '+e(nav.find(x=>x[0]===state.screen)?.[1]||'')+'</b><div class="tiny">50 Pages · 10k assets · 100k Reels · SYNTHETIC, lazy fixtures</div></div><span class="demo">DEMO · NO API</span></header><main class="content" id="screen-title" tabindex="-1">'+({dashboard,pages:pagesScreen,library,publish,calendar,reels:reelsScreen,analytics,activity,settings}[state.screen]||dashboard)()+'</main></div></div>'+detail();document.title='Reels Studio v2 · '+state.screen;}
function drawKeepFocus(){const el=document.activeElement;const pos=el&&el.tagName==='INPUT'?el.selectionStart:null;draw();const field=document.getElementById('search');if(field&&pos!==null){field.focus();field.setSelectionRange(pos,pos);}}
const hash=location.hash.slice(1);if(nav.some(x=>x[0]===hash))state.screen=hash;
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.drawer)closeDetail();if(ev.key==='Tab'&&state.drawer){const panel=document.querySelector('.detail');const xs=[...panel.querySelectorAll('button,input,select,textarea,[tabindex]')].filter(x=>!x.disabled);if(xs.length){const first=xs[0],last=xs[xs.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus();}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus();}}}});
draw();

</script></body></html>
