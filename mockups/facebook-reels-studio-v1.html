function publish(){const v=VIDEOS.find(v=>v.id===state.selectedVideo)||VIDEOS[0];let targets=PAGES.filter(p=>p.status==='good');return `${header('Đăng Reels','Tạo lịch đăng cho một hoặc nhiều Fanpage; mỗi Page là một job độc lập',btn('Lịch sử xuất bản','activity',"navigate('activity')"))}<div class="stepper"><div class="step active"><b>1</b>Chọn nội dung</div><span class="connector"></span><div class="step active"><b>2</b>Chọn Fanpage</div><span class="connector"></span><div class="step active"><b>3</b>Lập lịch & rà soát</div></div><div class="composer"><div class="card preview-card"><div class="sectionhead"><h2>Video được chọn</h2><button class="btn tiny" onclick="openModal('chooseVideo')">Thay đổi</button></div><div class="preview-poster" style="background:${v.bg}"><div class="poster-art">${v.emoji}</div><div class="preview-title">${esc(v.title)}</div></div><div class="preview-controls"><div><b>${v.duration}</b> <span class="muted">· 9:16 · MP4</span></div><span class="pill green">${icon('check',11)} Hợp lệ (demo)</span></div><div style="border-top:1px solid #eaeef4;margin-top:17px;padding-top:15px"><label class="fieldlabel">Lịch mặc định (GMT+7)</label><input class="field" type="datetime-local" value="${state.schedule}" style="width:100%" onchange="changeDefaultTime(this.value)"><p class="muted" style="line-height:1.5;font-size:10px">Mỗi Page có thể chỉnh caption và giờ đăng riêng.</p></div></div><div class="card composer-table"><div class="headarea"><div class="sectionhead"><h2>Chọn Fanpage <span class="pill blue">${state.selectedPages.length} đã chọn</span></h2><button class="btn tiny" onclick="toggleAllPages()">Chọn tất cả</button></div><div class="select-list">${targets.map(p=>`<button class="selectchip ${state.selectedPages.includes(p.id)?'selected':''}" onclick="togglePage('${p.id}')"><span class="checkdot">${state.selectedPages.includes(p.id)?'✓':''}</span>${p.emoji} ${p.name}</button>`).join('')}</div><p class="micro" style="margin:10px 0 0">Fanpage cần cấp lại quyền được loại khỏi danh sách. Nội dung xuất bản lên nhiều Page có thể bị hạn chế phân phối nếu trùng lặp.</p></div><div style="padding:16px 19px 4px"><div class="sectionhead"><h2>Nội dung & lịch đăng theo Page</h2><span>Asia/Ho_Chi_Minh (GMT+7)</span></div></div><div class="composer-row" style="padding:8px 17px 6px;background:#fafbff;font-size:9px;color:#a0a9b9;text-transform:uppercase;font-weight:800"><span>Fanpage</span><span>Caption riêng</span><span>Ngày và giờ đăng</span><span></span></div><div id="composerRows">${state.selectedPages.map(id=>{const p=PAGES.find(p=>p.id===id);return `<div class="composer-row">${media(p,p.group)}<textarea class="field" aria-label="Caption cho ${p.name}" onchange="state.captions['${id}']=this.value">${esc(state.captions[id]??(v.title+' ✨\n#Reels #'+p.group.replaceAll(' ','')))}</textarea><input class="field targettime" type="datetime-local" value="${esc(state.schedules[id]??state.schedule)}" onchange="state.schedules['${id}']=this.value" aria-label="Giờ đăng ${p.name}"><button class="btn tiny" onclick="togglePage('${id}')" title="Bỏ chọn Page">${icon('close',12)}</button></div>`}).join('')||'<div class="empty">Chọn ít nhất một Fanpage để tiếp tục.</div>'}</div><div class="composer-action"><div><b style="font-size:12px">${state.selectedPages.length} job sẽ được tạo</b><div class="micro" style="margin-top:4px">Chưa đăng thật. Bấm rà soát để xem bản demo.</div></div>${prime('Rà soát trước khi đăng','arrow',"startReview()")}</div></div></div>`}
function calendar(){let days=['Th 2','Th 3','Th 4','Th 5','Th 6','Th 7','CN'];const events={1:[['10:15 · Bé Xinh Mỗi Ngày','green']],2:[['19:00 · Drama Gia Đình','']],3:[['14:30 · Chuyện Hàng Xóm','orange']],4:[['11:30 · Drama Gia Đình','green'],['18:00 · Bé Xinh Mỗi Ngày','']],5:[['17:30 · Drama Gia Đình',''],['19:45 · Chuyện Công Sở','']],6:[['20:00 · Góc Mẹ Bỉm','']],8:[['16:00 · Chuyện Hàng Xóm','green']],9:[['19:30 · Drama Gia Đình','']],11:[['15:00 · Tâm Sự Nàng Dâu','']],13:[['09:00 · Outfit Bé Yêu','']]};const dates=state.calendarMode==='week'?[12,13,14,15,16,17,18]:Array.from({length:28},(_,i)=>i+1);return `${header('Lịch đăng nội dung','Theo dõi và điều phối lịch Reels trên tất cả Fanpage',prime('Lên lịch Reel','plus',"navigate('publish')"))}<div class="card calendar-wrap"><div class="calendar-head"><div><h2 style="font-size:16px;margin:0 0 5px">Tháng 10, 2026</h2><span class="micro">Giờ hiển thị: Asia/Ho_Chi_Minh</span></div><div class="row"><div class="tabs"><button class="${state.calendarMode==='week'?'active':''}" onclick="state.calendarMode='week';render()">Tuần</button><button class="${state.calendarMode==='month'?'active':''}" onclick="state.calendarMode='month';render()">Tháng</button></div>${btn('Hôm nay','calendar',"toast('Đang xem tuần chứa ngày 15/10/2026')")}</div></div><div class="cal-grid">${days.map(d=>`<div class="cal-weekday">${d}</div>`).join('')}${dates.map((day,i)=>{const evt=events[i%14]||[];return `<div class="cal-day ${day===15?'selected':''}"><div class="cal-num ${day===15?'today':''}">${day}</div>${evt.map(x=>`<div class="cal-event ${x[1]}" onclick="openModal('event')">${x[0]}</div>`).join('')}</div>`}).join('')}</div><div style="display:flex;gap:17px;align-items:center;padding:16px 3px 0;color:#8e9aac;font-size:11px"><span><span class="tick" style="background:#6e7dec"></span> Đã lên lịch</span><span><span class="tick"></span> Đã xuất bản</span><span><span class="tick" style="background:#e3a65a"></span> Cần kiểm tra</span></div></div>`}
function reelTable(withAnalytics=false){const filtered=VIDEOS.filter(v=>v.title.toLowerCase().includes(state.reelQ.toLowerCase()));return `<div class="card table-wrap reels-table"><table class="table"><thead><tr><th>Video</th><th>Fanpage</th><th>Nguồn</th><th>Ngày đăng</th><th>Reel views</th><th>Tăng trưởng</th><th>Cập nhật</th><th></th></tr></thead><tbody>${filtered.map((v,i)=>{const p=PAGES[i%PAGES.length];const growth=i===5?'N/A':('+'+[32,28,17,13,9,0,7,3][i]+'%');return `<tr><td><div class="cell-media"><div class="reels-thumb" style="background:${v.bg}">${v.emoji}</div><div><div class="labelmain">${esc(v.title)}</div><div class="labelsub">Reel ID: ...${10231+i}</div></div></div></td><td>${esc(p.name)}</td><td><span class="pill ${i%3===0?'blue':'gray'}">${i%3===0?'Studio':'Imported'}</span></td><td class="muted">${v.date}</td><td><b>${i===5?'N/A':v.views}</b></td><td class="trend-up">${growth}</td><td class="muted">15/10 • 11:55</td><td><button class="btn tiny" onclick="showReel('${v.id}')">Chi tiết</button></td></tr>`}).join('')}</tbody></table></div>`}
function reels(){return `${header('Danh sách Reels','Bao gồm Reels xuất bản bằng Studio và Reels đã đăng trước đó',btn('Đồng bộ Reels','refresh',"toast('Demo: không truy vấn Meta API')"))}<div class="toolbar"><div class="search">${icon('search',16)}<input placeholder="Tìm video..." value="${esc(state.reelQ)}" oninput="state.reelQ=this.value;refreshView()"></div><select class="field" onchange="toast('Bộ lọc Page sẽ dùng dữ liệu API thật')"><option>Tất cả Fanpage</option>${PAGES.map(p=>`<option>${p.name}</option>`).join('')}</select>${btn('Bộ lọc','filter',"toast('Bộ lọc minh họa')")}${btn('Xuất CSV','download',"toast('Bản demo không có dữ liệu thực để xuất')")}</div>${reelTable()}`}
function analytics(){const pages=[['all','Tất cả Fanpage'],...PAGES.map(p=>[p.id,p.name])];return `${header('Reels Analytics','Theo dõi hiệu suất theo Reel, Page và thời gian thu thập số liệu',btn('Xuất báo cáo','download',"toast('CSV chỉ khả dụng khi có dữ liệu thực')"))}<div class="banner info">${icon('info',18)}<div><b>Chỉ số có điều kiện theo quyền Meta API</b><p>Metrics không được cấp quyền sẽ hiển thị N/A, không mặc định 0. Thời điểm snapshot và độ trễ đồng bộ luôn được hiển thị.</p></div></div><div class="toolbar"><select class="field" onchange="state.analyticsPage=this.value;toast('Đã đổi bộ lọc Page (demo)')">${pages.map(([id,name])=>`<option value="${id}" ${id===state.analyticsPage?'selected':''}>${name}</option>`).join('')}</select><div class="tabs"><button class="${state.range===7?'active':''}" onclick="setRange(7)">7 ngày</button><button class="${state.range===30?'active':''}" onclick="setRange(30)">30 ngày</button></div><div class="micro">Snapshot cuối (demo): 15/10/2026 • 11:55</div></div><div class="kpi-grid">${kpi('Reel views tổng','4.82M','eye','','Snapshot mới nhất của nhóm Reels')}${kpi('Views / Reel','12.5K','analytics','green','Trung bình demo · Không chuẩn hóa tuổi')}${kpi('Số Reels đo được','352 / 386','reels','','34 Reels không có dữ liệu')}${kpi('Tỷ lệ có dữ liệu','91.2%','shield','orange','Dựa trên metric catalog')}</div><div class="dashboard-mid"><div class="card cardpad"><div class="sectionhead"><div><h2>Thay đổi lượt xem theo snapshot</h2><span>Giá trị tăng thêm qua các lần lấy dữ liệu</span></div><div class="legend"><span class="point"></span> View growth</div></div>${lineChart()}</div><div class="card cardpad"><div class="sectionhead"><h2>Cơ cấu hiệu suất</h2><span>Theo chủ đề (demo)</span></div><div style="display:flex;gap:22px;align-items:center;margin-top:33px"><div class="ring"><div><b>4.82M</b><span>Reel views</span></div></div><div class="segment-list"><div class="segment"><i class="segment-dot"></i>Drama <b>62%</b></div><div class="segment"><i class="segment-dot" style="background:#90b0ec"></i>Thời trang <b>21%</b></div><div class="segment"><i class="segment-dot" style="background:#d6ddf7"></i>Gia đình <b>17%</b></div></div></div><div style="margin-top:27px;font-size:11px;color:#9aa4b4">Chỉ cộng các Reel IDs duy nhất ở cùng thời điểm snapshot.</div></div></div><div class="card spaced" style="margin-top:16px"><div class="sectionhead" style="padding:18px 20px 0"><h2>Chi tiết hiệu suất Reels</h2><button class="btn tiny" onclick="navigate('reels')">Xem toàn bộ ${icon('arrow',12)}</button></div>${reelTable(true)}</div>`}
function activity(){const statuses=['Tất cả','Scheduled','Published','Uncertain','Blocked auth','Failed'];const filtered=JOBS.filter(j=>state.jobFilter==='Tất cả'||j.state===state.jobFilter);const pillMap={'Scheduled':['blue','Đã lên lịch'],'Published':['green','Đã xuất bản'],'Uncertain':['orange','Chưa chắc chắn'],'Blocked auth':['red','Mất quyền'],'Failed':['red','Thất bại']};return `${header('Hoạt động & hàng đợi','Trạng thái xuất bản và lịch sử các job riêng biệt theo Fanpage',btn('Chạy kiểm tra queue','refresh',"toast('Không có worker thật trong mockup')"))}<div class="banner">${icon('alert',18)}<div><b>Không được retry mù các job UNCERTAIN</b><p>Cần thực hiện reconciliation để xác nhận Meta đã đăng hay chưa trước khi thử lại.</p></div></div><div class="toolbar"><div class="facet">${statuses.map(s=>`<button class="${state.jobFilter===s?'on':''}" onclick="state.jobFilter='${s}';render()">${s==='Tất cả'?'Tất cả':s}</button>`).join('')}</div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Job</th><th>Fanpage</th><th>Video</th><th>Lịch đăng</th><th>Attempts</th><th>Trạng thái</th><th></th></tr></thead><tbody>${filtered.map(j=>{const p=PAGES[j.page],v=VIDEOS[j.video],s=pillMap[j.state];return `<tr><td><b>${j.id}</b></td><td>${media(p)}</td><td>${v.title}</td><td class="muted">${j.time}</td><td>${j.attempt}</td><td><span class="pill ${s[0]}"><span class="dot"></span>${s[1]}</span></td><td><button class="btn tiny" onclick="showJob('${j.id}')">Xem job ${icon('chevron',12)}</button></td></tr>`}).join('')}</tbody></table></div>`}
function settings(){return `${header('Cài đặt & sức khỏe hệ thống','Giám sát kết nối, cấu hình vận hành và độ an toàn dữ liệu') }<div class="banner">${icon('alert',18)}<div><b>Meta OAuth chưa được cấu hình</b><p>Đây là UI mockup. Không lưu App Secret, Page Access Token hoặc dữ liệu nhạy cảm trong phiên bản demo.</p></div></div><div class="settings-grid"><div class="card cardpad"><div class="sectionhead"><h2>Kết nối Meta</h2><span class="pill orange">P0 chưa thực hiện</span></div>${[['Loại ứng dụng','Internal (private)'],['Graph API version','v26.0 (target)'],['Facebook App ID','Chưa cấu hình'],['OAuth callback','Chưa hoạt động'],['Page permissions','Chưa xác minh']].map(x=>`<div class="info-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}<div style="margin-top:16px">${btn('Xem Fanpages','pages',"navigate('pages')")}</div></div><div class="card cardpad"><div class="sectionhead"><h2>Hệ thống</h2><span class="pill gray">Mockup only</span></div>${[['API server','Chưa triển khai'],['Publisher worker','Chưa triển khai'],['Scheduler queue','Chưa triển khai'],['Object storage','Chưa triển khai'],['Timezone','Asia/Ho_Chi_Minh']].map(x=>`<div class="info-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card cardpad"><div class="sectionhead"><h2>Bảo mật & quyền</h2></div><div style="display:flex;gap:13px;align-items:start">${icon('shield',23)}<p style="margin:0;color:#8792a4;line-height:1.75">Khi triển khai, toàn bộ Page tokens phải được mã hóa phía server. Worker, nội dung và credentials nằm ngoài frontend.</p></div></div><div class="card cardpad"><div class="sectionhead"><h2>Thông số vận hành đề xuất</h2></div>${[['Số Page mục tiêu','10–50 Pages'],['Mỗi Page đồng thời','1 publishing job'],['Queue tối đa (fixture)','300 jobs/ngày'],['Analytics freshness','Có timestamp nguồn']].map(x=>`<div class="info-row"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div>`}
function modals(){if(!state.modal)return '';const type=state.modal;let title='',body='',foot='';const close=`<button class="btn" onclick="closeModal()">Đóng</button>`;
if(type==='review'){title='Rà soát lịch đăng (bản demo)';body=`<div class="banner info">${icon('info',18)}<div><b>Không gửi dữ liệu lên Facebook</b><p>Chỉ minh họa bước cuối trước khi gọi API tạo publishing jobs.</p></div></div><p style="font-weight:800;margin-bottom:12px">${state.selectedPages.length} Fanpage được chọn</p>${state.selectedPages.map(id=>{const p=PAGES.find(p=>p.id===id);return `<div class="info-row"><span>${p.emoji} ${p.name}</span><b>${esc((state.schedules[id]??state.schedule).replace("T"," • "))}</b></div>`}).join('')}<p class="micro" style="line-height:1.5;margin-top:15px">Production sẽ gửi preview API, xử lý Idempotency-Key và tạo một job cho mỗi Page.</p>`;foot=`${close}<button class="btn primary" onclick="closeModal();toast('Đã xem preview • Không có job thực nào được tạo')">${icon('check',14)} Xác nhận demo</button>`}
else if(type==='connect'){title='Kết nối tài khoản Facebook';body=`<div class="banner info">${icon('info',18)}<div><b>Chưa triển khai Facebook Login</b><p>Sau P0, nút này sẽ dẫn vào Meta OAuth và kiểm tra quyền Page thực tế.</p></div></div><div class="ghostbox">${icon('globe',34)}<h3 style="color:#536079">Facebook Login</h3><p>Ủy quyền chính thức qua Meta Graph API</p></div>`;foot=close}
else if(type==='upload'){title='Upload video mới';body=`<div class="ghostbox">${icon('upload',34)}<h3 style="color:#52617a">Kéo thả video MP4 vào đây</h3><p>Mockup UI • Không upload tệp thật</p><button class="btn" onclick="toast('File picker chỉ có sau khi triển khai P1')">${icon('file',14)} Chọn video</button></div><p class="micro" style="line-height:1.5;margin-top:12px">P1 thực hiện upload streaming, ffprobe và validation trước khi cho phép đăng.</p>`;foot=close}
else if(type==='chooseVideo'){title='Chọn video từ Library';body=`<div style="max-height:400px;overflow:auto">${VIDEOS.map(v=>`<button class="btn" style="display:flex;width:100%;justify-content:space-between;margin-bottom:6px" onclick="state.selectedVideo='${v.id}';closeModal();render()"><span>${v.emoji} ${esc(v.title)}</span><span class="muted">${v.duration}</span></button>`).join('')}</div>`;foot=close}
else if(type==='media'){const v=VIDEOS.find(v=>v.id===state.selectedVideo);title=v.title;body=`<div class="poster" style="background:${v.bg};height:210px;border-radius:10px"><div class="poster-art">${v.emoji}</div></div><div class="info-row"><span>Thời lượng</span><b>${v.duration}</b></div><div class="info-row"><span>Thông số</span><b>1080 × 1920 · MP4</b></div><div class="info-row"><span>Ngày upload (demo)</span><b>${v.date}</b></div>`;foot=`${close}<button class="btn primary" onclick="closeModal();navigate('publish')">${icon('publish',14)} Sử dụng video này</button>`}
else if(type==='event'){title='Chi tiết lịch đăng';body=`<div class="info-row"><span>Fanpage</span><b>Drama Gia Đình</b></div><div class="info-row"><span>Ngày & giờ</span><b>15/10/2026 • 17:30</b></div><div class="info-row"><span>Trạng thái</span><b>Scheduled (demo)</b></div><p class="micro">Bản production chỉ cho phép sửa job chưa bắt đầu.</p>`;foot=close}
else{title=state.modal.title||'Thông tin';body=state.modal.body||'';foot=close}
return `<div class="scrim" role="presentation" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modalhead"><h3>${esc(title)}</h3><button class="cross" onclick="closeModal()" aria-label="Đóng">${icon('close',17)}</button></div><div class="modalbody">${body}</div><div class="modalfooter">${foot}</div></section></div>`}
function showPage(id){const p=PAGES.find(p=>p.id===id);state.modal={title:p.name,body:`<div class="info-row"><span>Page ID (rút gọn)</span><b>${p.code}</b></div><div class="info-row"><span>Nhóm</span><b>${p.group}</b></div><div class="info-row"><span>Reels</span><b>${p.reels}</b></div><div class="info-row"><span>Trạng thái kết nối</span><b>${p.status==='good'?'Có quyền (demo)':'Cần cấp quyền (demo)'}</b></div><p class="micro">Tại phiên bản thật, sẽ hiển thị granted scopes, Page tasks, last sync và lỗi Meta đã chuẩn hóa.</p>`};render()}
function showJob(id){const j=JOBS.find(j=>j.id===id);state.modal={title:'Chi tiết '+j.id,body:`<div class="info-row"><span>Page</span><b>${PAGES[j.page].name}</b></div><div class="info-row"><span>Video</span><b>${VIDEOS[j.video].title}</b></div><div class="info-row"><span>Trạng thái</span><b>${j.state}</b></div><div class="info-row"><span>Số attempts</span><b>${j.attempt}</b></div><h4 style="margin-top:20px">Lịch sử trạng thái (minh họa)</h4><div class="timeline"><div class="timelineitem"><b>Job được tạo</b><p>Đã lưu snapshot nội dung</p></div><div class="timelineitem"><b>Worker xử lý</b><p>Trạng thái: ${j.state}</p></div></div>${j.state==='Uncertain'?'<div class="banner"><div><b>UNCERTAIN — Không retry trực tiếp</b><p>Phải reconcile trạng thái trên Meta trước.</p></div></div>':''}`};render()}
function showReel(id){const v=VIDEOS.find(v=>v.id===id);state.modal={title:v.title,body:`<div class="info-row"><span>Lượt xem (demo)</span><b>${v.views}</b></div><div class="info-row"><span>Thời điểm thu thập</span><b>15/10/2026 11:55</b></div><div class="info-row"><span>Nguồn</span><b>Mock snapshot</b></div><div class="info-row"><span>Watch time</span><b>N/A (chưa xác minh)</b></div><p class="micro">Production sẽ có snapshot history, ID mapping và provenance theo metric.</p>`};render()}
function navigate(p){state.page=p;state.modal=null;render();window.scrollTo(0,0);history.replaceState(null,'','#'+p)}
function refreshView(){const active=document.activeElement;if(active&&active.tagName==='INPUT'&&active.type==='text'){const sel=active.selectionStart,selector=active.placeholder;render();const next=Array.from(document.querySelectorAll('input')).find(e=>e.placeholder===selector);if(next){next.focus();next.setSelectionRange(sel,sel)}}else render()}
function openModal(t){state.modal=t;render()};function closeModal(){state.modal=null;render()}
function changeDefaultTime(val){state.schedule=val;state.selectedPages.forEach(id=>state.schedules[id]=val);document.querySelectorAll('.targettime').forEach(x=>x.value=val)}
function startReview(){if(!state.selectedPages.length){toast('Vui lòng chọn ít nhất một Fanpage');return}openModal('review')}
function togglePage(id){state.selectedPages=state.selectedPages.includes(id)?state.selectedPages.filter(x=>x!==id):[...state.selectedPages,id];render()}
function toggleAllPages(){const ids=PAGES.filter(p=>p.status==='good').map(p=>p.id);state.selectedPages=state.selectedPages.length===ids.length?[]:ids;render()}
function setRange(r){state.range=r;render()};let toastTimeout;function toast(msg){const old=document.querySelector('.toast');if(old)old.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=msg;document.body.append(d);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>d.remove(),3400)}
function render(){const routes={dashboard:overview,pages,video,publish,calendar,reels,analytics,activity,settings};document.getElementById('app').innerHTML=`<div class="app">${sidebar()}<div class="workspace">${topbar()}<main class="content">${(routes[state.page]||overview)()}</main></div></div>${modals()}`;document.title=`${navitems.find(x=>x[0]===state.page)?.[1]} | Reels Studio — UI Mockup`}
const initial=location.hash.replace('#','');if(navitems.some(x=>x[0]===initial))state.page=initial;
render();
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&state.modal)closeModal()});
</script></body></html>
