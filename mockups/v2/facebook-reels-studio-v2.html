function localSlot(date,offset){const ms=Date.parse(`${date}:00+07:00`)+offset*60000;const d=new Date(ms+7*3600000);return d.toISOString().slice(0,16)}
function utcSlot(s){return new Date(s+':00+07:00').toISOString()}
function createMatrix(){const c=state.composer;const assets=[...state.selectedAssets].map(x=>ASSETS.find(a=>a.id===x)).filter(Boolean);const pages=[...state.selectedPages].map(x=>PAGES.find(p=>p.id===x)).filter(p=>p?.status==='ACTIVE');if(!assets.length||!pages.length){toast('Chọn ít nhất một video và một Page có quyền.');return}const aa=c.mode==='quick'?[assets[0]]:assets;const candidates=[];if(c.mode==='quick'){pages.forEach(p=>candidates.push([aa[0],p]));}else if(c.strategy==='all'){for(const a of aa)for(const p of pages)candidates.push([a,p]);}else{aa.forEach((a,i)=>candidates.push([a,pages[i%pages.length]]));}
if(candidates.length>100){toast(`Batch có ${candidates.length} targets; tối đa 100 trong v2 đề xuất. Giảm video hoặc Page.`);return}if(candidates.some(([a])=>a.status!=='VALID')){toast('Có video chưa hợp lệ. Chỉ tạo matrix sau khi validation hoàn tất.');return}
const previous=new Map(c.rows.map(r=>[r.key,r]));c.rows=candidates.map(([a,p],i)=>{const key=`${a.i}:${p.n}:${i}`;return previous.get(key)||{key,asset:a.i,page:p.n,caption:`${a.title} ✨ #${a.category.replaceAll(' ','')}`,time:localSlot(c.date,i*Number(c.spacing))}});c.generated=true;render();document.querySelector('#matrix-panel')?.scrollIntoView({block:'nearest',behavior:'smooth'})}
function matrixUpdate(i,k,v){if(state.composer.rows[i])state.composer.rows[i][k]=v}
function removeTarget(i){state.composer.rows.splice(i,1);render()}
function hasDuplicateRows(rows){return rows.some((r,i)=>rows.findIndex(x=>x.asset===r.asset&&x.page===r.page&&x.time===r.time)<i)}
function reviewMatrix(){const rows=state.composer.rows;if(!rows.length){toast('Cần tạo matrix trước khi rà soát.');return}if(rows.some(r=>!r.caption.trim()||!r.time)){toast('Vui lòng nhập caption và lịch đầy đủ cho từng job.');return}if(hasDuplicateRows(rows)){toast('Phát hiện trùng video/Page/thời điểm. Hãy sửa trước khi rà soát.');return}state.modal='review';render()}
function publish(){const c=state.composer;const assets=[...state.selectedAssets].map(id=>ASSETS.find(a=>a.id===id)).filter(Boolean),total=c.rows.length;const filteredPages=PAGES.filter(p=>p.status==='ACTIVE'&&(c.group==='all'||p.group===c.group)&&p.name.toLowerCase().includes(c.query.toLowerCase()));return `${heading('Bulk Reels Publisher','P1: một video / một Page · P3: đa video / nhiều Page với schema amendment',button('Xem queue','nav(\'activity\')','activity'))}${notice('Phải cập nhật backend P3 cho Multi-Video Batch','Spec v1 có UNIQUE(batch_id,page_id). UI v2 đề xuất cho phép nhiều job/Page/batch bằng target_key và uniqueness mới. Đây là contract amendment nội bộ, không phụ thuộc tính năng Meta mới.','warn')}<div class="flowtabs"><span class="steplabel on"><span class="stepnum">1</span>Video Assets</span><span class="sep"></span><span class="steplabel on"><span class="stepnum">2</span>Fanpages</span><span class="sep"></span><span class="steplabel on"><span class="stepnum">3</span>Publishing Matrix</span><span class="sep"></span><span class="steplabel on"><span class="stepnum">4</span>Review</span></div><div class="tabs" style="width:max-content;margin-bottom:15px"><button class="${c.mode==='quick'?'active':''}" onclick="setMode('quick')">Quick • 1 video → N Pages</button><button class="${c.mode==='batch'?'active':''}" onclick="setMode('batch')">Batch • N videos → Pages</button></div><div class="composer-layout"><div style="display:flex;flex-direction:column;gap:14px"><div class="card"><div class="panel-intro"><div><h2>Video đã chọn</h2><div class="micro" style="margin-top:5px">${assets.length} assets · từ Library</div></div>${button('Mở Library','nav(\'library\')','right','small')}</div><div class="composer-scroll">${assets.slice(0,60).map((a,i)=>`<div class="choose-item">${mkthumb(a,true)}<div class="grow"><b>${esc(a.title)}</b><span>${a.status==='VALID'?'Sẵn sàng':'Cần validate'} · ${a.seconds}s</span></div>${c.mode==='batch'||i===0?`<button class="btn iconbtn small" onclick="composerRemoveAsset('${a.id}')" title="Bỏ video">${icon('close')}</button>`:''}</div>`).join('')||'<div class="empty">Hãy chọn video trong Library.</div>'}${assets.length>60?'<div class="micro" style="padding:12px">Chỉ hiển thị 60 mục đầu, lựa chọn vẫn giữ nguyên.</div>':''}</div></div><div class="card"><div class="panel-intro"><h2>Thiết lập lịch mặc định</h2>${label('GMT+7','blue')}</div><div class="composer-settings"><div class="control wide"><label>Ngày giờ bắt đầu (Asia/Ho_Chi_Minh)</label><input type="datetime-local" class="field" value="${c.date}" onchange="composerBaseUpdate('date',this.value)"></div><div class="control wide"><label>Giãn cách giữa từng job trong batch (phút)</label><select class="field" onchange="composerBaseUpdate('spacing',this.value)">${[0,15,30,60,120].map(x=>`<option value="${x}" ${Number(c.spacing)===x?'selected':''}>${x} phút</option>`).join('')}</select></div>${c.mode==='batch'?`<div class="control wide"><label>Cách gán video → Page (trước review có thể chỉnh từng target)</label><select class="field" onchange="composerBaseUpdate('strategy',this.value)"><option value="pair" ${c.strategy==='pair'?'selected':''}>Round-robin — mỗi video gán một Page</option><option value="all" ${c.strategy==='all'?'selected':''}>Cross-product — mọi video × mọi Page</option></select></div>`:''}</div></div></div><div class="card"><div class="panel-intro"><div><h2>Chọn Fanpage</h2><div class="micro" style="margin-top:5px">${state.selectedPages.size} được chọn · Page mất quyền bị khóa</div></div>${button('Chọn / Bỏ nhóm','composerSelectGroup()','check','small')}</div><div class="pagefilters"><select class="field" aria-label="Nhóm Fanpage" onchange="composerGroup(this.value)"><option value="all">Tất cả nhóm</option>${cats.map(x=>`<option ${c.group===x?'selected':''}>${x}</option>`).join('')}</select><div class="search" style="min-width:0;max-width:none">${icon('search')}<input aria-label="Tìm Page" placeholder="Tìm Page..." value="${esc(c.query)}" oninput="state.composer.query=this.value;debouncedRender(this)"></div></div><div class="scrollpages"><div class="page-picker">${filteredPages.map(p=>`<button class="pagepick ${state.selectedPages.has(p.id)?'on':''}" onclick="composerPageToggle('${p.id}')">${mkface(p)}<span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p.name)}</span>${state.selectedPages.has(p.id)?icon('check',12):''}</button>`).join('')}</div></div><div class="notice" style="margin:12px 15px;background:#fbfcff;border-color:#eceff8;color:#8793a9"><div>${icon('info',14)}</div><div><p>Chỉ Page có capability cho phép publish mới chọn được. UI không thể tự cấp quyền Meta.</p></div></div></div></div><div class="card" id="matrix-panel" style="margin-top:16px"><div class="matrix-head"><div><h2>Publishing Matrix</h2><div class="micro" style="margin-top:5px">1 dòng = 1 target = 1 publish job, có variant, Page và giờ riêng</div></div>${button('Tạo / làm mới matrix','createMatrix()','refresh','soft')}</div><div class="matrix-summary"><span class="matrixsummary-total">${nf(total)} jobs</span><span>${[...new Set(c.rows.map(r=>r.page))].length} Pages</span><span>${[...new Set(c.rows.map(r=>r.asset))].length} videos</span><span>${c.generated?label('Đã tạo matrix nháp','good'):label('Cần tạo lại','warn')}</span><span class="micro" style="margin-left:auto">Tối đa 100 targets/submit · đề xuất P3</span></div>${total?table(`<tr><th>#</th><th>Video</th><th>Fanpage</th><th>Caption riêng</th><th>Giờ đăng (GMT+7)</th><th>Hành động</th></tr>`,c.rows.slice(0,100).map((r,i)=>{const a=ASSETS[r.asset],p=PAGES[r.page];return `<tr><td>${i+1}</td><td>${mediacell(a)}</td><td>${pagecell(p)}</td><td><input class="field tiny caption" aria-label="Caption job ${i+1}" value="${esc(r.caption)}" onchange="matrixUpdate(${i},'caption',this.value)"></td><td><input class="field tiny time" aria-label="Giờ đăng job ${i+1}" type="datetime-local" value="${r.time}" onchange="matrixUpdate(${i},'time',this.value)"></td><td>${button('',`removeTarget(${i})`,'close','iconbtn small')}</td></tr>`}).join('')):`<div class="empty">Chọn video + Page, sau đó bấm “Tạo / làm mới matrix”. ${icon('folder')}</div>`}<div class="composer-footer"><div><b>${nf(total)} job dự kiến</b><p>Tạo preview/submit sẽ gọi POST /publish-batches/preview → POST /publish-batches. Mockup không gọi API.</p></div>${button('Rà soát trước khi tạo job','reviewMatrix()','check','primary')}</div></div>${contractfoot(['POST /publish-batches/preview','POST /publish-batches','publish_jobs','ADDENDUM target_key / uniqueness P3'])}`}

function jobSet(k,v){state.jobs[k]=v;state.jobs.pageNo=1;render()}
function jobsPage(n){state.jobs.pageNo=Math.max(1,Math.min(n,Math.ceil(jobsFiltered().length/50)));render()}
function activity(){const f=state.jobs,all=jobsFiltered(),rows=all.slice((f.pageNo-1)*50,f.pageNo*50);return `${heading('Publish Jobs & Activity',`${nf(JOB_COUNT)} job fixtures · từng Page xử lý độc lập`,button('Chạy health-check','toast(\'P1/P3: GET /system/health; chưa triển khai.\')','refresh'))}${notice('UNCERTAIN: reconcile trước, tuyệt đối không blind retry','UI chỉ cho xem chi tiết và mô phỏng yêu cầu kiểm tra remote; backend phải xác minh video_id / permalink trước khi quyết định.','warn')}<div class="toolbar"><select class="field" aria-label="Lọc trạng thái job" onchange="jobSet('status',this.value)"><option value="all">Mọi trạng thái</option>${['SCHEDULED','PUBLISHED','PROCESSING','FAILED','UNCERTAIN','BLOCKED_AUTH'].map(x=>`<option ${f.status===x?'selected':''}>${x}</option>`).join('')}</select><select class="field" aria-label="Lọc Page" onchange="jobSet('page',this.value)"><option value="all">Tất cả Fanpages</option>${PAGES.map(p=>`<option value="${p.n}" ${f.page===String(p.n)?'selected':''}>${esc(p.name)}</option>`).join('')}</select><div class="right">${label(`${nf(all.length)} jobs`,'blue')}</div></div><div class="card">${table(`<tr><th>Job ID</th><th>Video</th><th>Fanpage</th><th>Lịch (GMT+7)</th><th>Attempt</th><th>Trạng thái</th><th></th></tr>`,rows.map(j=>`<tr><td>…${j.id.slice(-8)}</td><td>${mediacell(ASSETS[j.asset])}</td><td>${pagecell(PAGES[j.page])}</td><td>${String(j.day).padStart(2,'0')}/10/2026 · ${j.hour}:30</td><td>${j.attempt}</td><td>${label(j.status,j.status==='PUBLISHED'?'good':j.status==='SCHEDULED'?'blue':['UNCERTAIN','PROCESSING'].includes(j.status)?'warn':'danger')}</td><td><button class="actionlink" onclick="openJob(${j.i})">Xem job →</button></td></tr>`).join(''))}${pager(all.length,f.pageNo,50,'jobsPage')}</div>${contractfoot(['GET /publish-jobs','GET /publish-jobs/{id}','POST /publish-jobs/{id}/reconcile','P1-07/08'])}`}
function settings(){return `${heading('Cài đặt & System Health','Tổng quan các phụ thuộc hệ thống và trạng thái Meta capability đã kiểm chứng')}<div class="split"><div class="card pad"><div class="bar"><h2>Meta connection</h2>${label('NOT VERIFIED','warn')}</div>${[['Graph API target','v26.0 (configurable)'],['OAuth status','P0 chưa thực hiện'],['Owned Page proof','P0 chưa thực hiện'],['Reels publishing','P0-M05–M09 chưa kiểm chứng'],['Per-Reel view metric','P0-M10 chưa kiểm chứng'],['Import Reels','P0-M11 chưa kiểm chứng']].map(x=>`<div class="dlrow"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card pad"><div class="bar"><h2>Ứng dụng và hạ tầng</h2>${label('DESIGN ONLY','gray')}</div>${[['Web frontend','Prototype HTML standalone'],['FastAPI','Chưa triển khai'],['PostgreSQL','Chưa triển khai'],['Worker/Scheduler','Chưa triển khai'],['Object storage','Chưa triển khai'],['Timezone','Asia/Ho_Chi_Minh']].map(x=>`<div class="dlrow"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></div><div class="card pad" style="margin-top:16px"><h2>UI ↔ Backend Alignment</h2><p class="muted" style="margin:12px 0;line-height:1.7">Mọi điều khiển trong mockup thuộc một trong ba loại: (A) contract v1 đã có nhưng chưa implement, (B) proposed internal addendum BE có thể triển khai P1–P3, (C) yêu cầu Meta live gate nên chưa bật dữ liệu thật. Mục tiêu: không có màn hình hứa tính năng API chưa được chứng minh.</p>${button('Xem feature/API matrix','openContract()','info','soft')}${contractfoot(['docs/UI_V2_BACKEND_ALIGNMENT.md','docs/UI_V2_IMPLEMENTATION_ADDENDUM.md'])}</div>`}
function openModal(kind){state.modal=kind;render()}
function closeModal(){state.modal=null;render()}
function closeDrawer(){state.drawer=null;render()}
function openAsset(i){state.drawer={type:'asset',i};render()}
function openPage(i){state.drawer={type:'page',i};render()}
function openReel(i){state.drawer={type:'reel',i};render()}
function openJob(i){state.drawer={type:'job',i};render()}
function openContract(){state.modal='contract';render()}
function drawDrawer(){const d=state.drawer;if(!d)return '';let title='',subtitle='',body='';if(d.type==='asset'){const a=ASSETS[d.i];title='Chi tiết Video Asset';subtitle=a.title;body=`<div style="height:190px;background:${a.bg};color:white;border-radius:12px;display:grid;place-items:center;font-size:70px">${a.emoji}</div>${[['Asset ID',a.id],['Filename',`video_${String(a.i+1).padStart(5,'0')}.mp4`],['Trạng thái',a.status],['Duration',a.seconds+' seconds'],['Resolution','1080 × 1920 (demo)'],['SHA-256','Vì dữ liệu giả lập nên không có hash thật'],['Lượt publish Studio',a.uses+' lần (demo)']].map(x=>`<div class="dlrow"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}<h3 style="margin-top:22px">Usage history (Studio only)</h3><p class="muted" style="line-height:1.6;margin-top:7px">Backend P2 phải join media_assets → content_variants → publish_jobs → published_reels. Không mặc định map Imported Reel qua tên file.</p>${button('Chọn video và chuyển Publisher',`state.selectedAssets.add('${a.id}');state.composer.mode='batch';closeDrawer();nav('publish')`,'publish','primary')}`}
if(d.type==='page'){const p=PAGES[d.i];title='Chi tiết Fanpage';subtitle=p.name;body=`<div class="bar">${pagecell(p)}${label(p.status,p.status==='ACTIVE'?'good':'warn')}</div>${[['Page ID',p.id],['Nhóm',p.group],['Authorization',p.status],['Task/Scope','Bắt buộc kiểm chứng từ P0'],['Reels trong fixture',p.reels],['Latest Reel views (demo)',short(p.views)]].map(x=>`<div class="dlrow"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}${button('Health check (demo)','toast(\'P1: POST /pages/{id}/health-check.\')','refresh','soft')}`}
if(d.type==='reel'){const r=REELS[d.i],a=ASSETS[r.asset],p=PAGES[r.page];title='Reel details & snapshots';subtitle=a.title;body=`<div class="bar">${mediacell(a)}${label(r.origin,'blue')}</div>${[['Page',p.name],['Reel FB video ID',String(9300000+r.i)],['Post ID','P0 mapping chưa kiểm chứng'],['Lượt xem Reel',r.views===null?'N/A':nf(r.views)],['Availability',r.availability],['Thời điểm snapshot',FIXTURE_DATE+' 11:55 (giả lập)'],['Origin',r.origin]].map(x=>`<div class="dlrow"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}<h3 style="margin-top:21px">Snapshot growth</h3><div class="chartbox" style="padding:0">${lineChart()}</div><p class="micro">P0 metric chưa được chứng minh. Không tạo link Reel giả hay suy luận post ID.</p>`}
if(d.type==='job'){const j=JOBS[d.i],a=ASSETS[j.asset],p=PAGES[j.page];title='Publish job details';subtitle=j.id;body=`<div class="bar">${mediacell(a)}${label(j.status,j.status==='UNCERTAIN'?'warn':j.status==='PUBLISHED'?'good':'blue')}</div>${[['Page',p.name],['Asset',a.title],['Batch ID','Fixture only'],['Attempt',j.attempt],['Meta video ID','N/A (no live provider)'],['Lịch đăng',`${j.day}/10/2026 ${j.hour}:30 GMT+7`],['Last safe error',j.status==='UNCERTAIN'?'REMOTE_STATE_AMBIGUOUS':'N/A']].map(x=>`<div class="dlrow"><span>${x[0]}</span><b>${esc(x[1])}</b></div>`).join('')}<h3 style="margin-top:20px">State timeline (mock)</h3><div class="dlrow"><span>1. Batch accepted</span><b>SCHEDULED</b></div><div class="dlrow"><span>2. Worker lifecycle</span><b>${j.status}</b></div>${j.status==='UNCERTAIN'?notice('Không thể retry tự động','Phải có kết quả reconcile remote đủ mạnh trước.','warn'):''}${button('Reconcile (mô phỏng)','toast(\'Bản mockup không gọi Meta. P1: POST /publish-jobs/{id}/reconcile.\')','refresh','soft')}`}
return `<div class="overlay" onclick="closeDrawer()"><aside class="rightpanel" role="dialog" aria-modal="true" aria-label="${esc(title)}" onclick="event.stopPropagation()"><div class="drawerhead"><div><h2 style="font-size:17px">${title}</h2><p class="micro" style="margin-top:7px">${esc(subtitle)}</p></div><button class="btn iconbtn" onclick="closeDrawer()" aria-label="Đóng">${icon('close')}</button></div><div class="drawerbody">${body}${contractfoot(['P0/P1/P2 gated by phase','Fixture data, never real Meta'])}</div></aside></div>`}
function drawModal(){const m=state.modal;if(!m)return '';let title='',body='',foot=`${button('Đóng','closeModal()','','')}`;if(m==='review'){const rows=state.composer.rows;title='Rà soát Batch trước khi gửi';body=`${notice('DEMO: không có job thực được tạo','Trong production, frontend phải gọi preview API, đợi kết quả và chỉ sau đó mới cho phép confirm submit với Idempotency-Key.')}`+`<div class="kpis" style="grid-template-columns:repeat(3,1fr)">${kpi('Số target jobs',nf(rows.length),'Bắt buộc khớp POST preview','list')}${kpi('Số Pages',new Set(rows.map(x=>x.page)).size,'Mỗi Page có thể >1 job sau amendment','pages')}${kpi('Số video',new Set(rows.map(x=>x.asset)).size,'Nhiều variant IDs trong targets','library')}</div>`+`<div class="card">${table(`<tr><th>Target</th><th>Video</th><th>Fanpage</th><th>Giờ địa phương</th><th>UTC (submit)</th><th>Caption</th></tr>`,rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(ASSETS[r.asset].title.slice(0,30))}</td><td>${esc(PAGES[r.page].name)}</td><td>${esc(r.time.replace('T',' '))}</td><td>${esc(utcSlot(r.time).replace('T',' ').slice(0,16))}</td><td title="${esc(r.caption)}">${esc(r.caption.slice(0,25))}…</td></tr>`).join(''))}</div><div style="margin-top:13px">${notice('Cảnh báo chia sẻ nội dung giữa nhiều Pages','Cùng một asset xuất hiện trên nhiều Page có thể chịu chính sách phân phối nội dung trùng lặp của Meta. Không hỗ trợ bypass.')}</div>`;foot=button('Quay lại chỉnh sửa','closeModal()','','')+button('Xác nhận demo (không tạo job)',"closeModal();toast('Đã review mockup; không gọi API / không tạo job.')",'check','primary')}
else if(m==='contract'){title='UI v2 ↔ Backend contract map';body=`${notice('Tất cả tính năng đang là mô phỏng','Màu trạng thái phân biệt contract sẵn có, addendum backend nội bộ và LIVE-GATE Meta.')}<div class="card">${table(`<tr><th>UI capability</th><th>BE contract / change</th><th>Phase</th><th>Loại</th></tr>`,[['Page connection','GET /pages; POST /pages/discover','P1','V1'],['Media pagination','GET /media?cursor,limit,status','P1','V1'],['Search + sort trên toàn DB','GET /media?q,sort + indexes','P1','ADD'],['Asset usage history','GET /media/{id}/publications','P2','ADD'],['Batch one video per Page','POST /publish-batches/preview, submit','P1/P3','V1'],['Multi-video + repeat Page','target_key + uniqueness change','P3','ADD'],['Agenda high density','GET /publish-jobs/calendar-summary','P3','ADD'],['Reels list + views','GET /reels; GET /analytics/overview','P2','LIVE'],['Reel metric availability','GET /analytics/metrics/availability','P2','LIVE'],['Job reconciliation','POST /publish-jobs/{id}/reconcile','P1','V1']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${label(r[3],r[3]==='V1'?'good':r[3]==='ADD'?'blue':'warn')}</td></tr>`).join(''))}</div><div class="contractnote">V1 = có trong spec, chưa implement. ADD = backend addendum nội bộ có thể triển khai theo phase, chưa được merge. LIVE = P0 phải thử Meta thật trước khi bật. Chi tiết trong docs/UI_V2_BACKEND_ALIGNMENT.md và docs/UI_V2_IMPLEMENTATION_ADDENDUM.md.</div>`}
else if(m==='upload'){title='Upload Video (P1)';body=`<div class="empty" style="background:#f7f9fe;border:2px dashed #dfe5f3;border-radius:14px">${icon('upload',30)}<h2>Chọn file MP4 / Kéo thả</h2><p>UI only: không lấy file, không lưu media, không ghi storage.</p></div>${contractfoot(['POST /media','GET /media/{id}','ffprobe + validation','P1-04'])}`}
else if(m==='connect'){title='Kết nối Facebook (P0/P1)';body=notice('Facebook Login chưa cấu hình','Cần kiểm thử Meta App/role/permissions trên Fanpage thật trước khi xây luồng đăng nhập chính thức.','warn')+`<div class="empty">${icon('lock',28)}<h2>Meta OAuth</h2><p>GET /auth/facebook/start sau P0</p></div>`}
return `<div class="overlay" onclick="closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" onclick="event.stopPropagation()"><div class="modalhead"><h2 style="font-size:17px">${title}</h2><button class="btn iconbtn" aria-label="Đóng" onclick="closeModal()">${icon('close')}</button></div><div class="modalcontent">${body}</div><div class="modalfoot">${foot}</div></div></div>`}
let debounceTimer;
function debouncedRender(el){const key=el?.getAttribute('placeholder'),pos=el?.selectionStart;clearTimeout(debounceTimer);debounceTimer=setTimeout(()=>{render();if(key){const next=[...document.querySelectorAll('input')].find(x=>x.placeholder===key);if(next){next.focus();if(typeof pos==='number')next.setSelectionRange(pos,pos)}}},220)}
let toastTimer;
function toast(str){document.querySelector('.toast')?.remove();const d=document.createElement('div');d.className='toast';d.setAttribute('role','status');d.textContent=str;document.body.appendChild(d);clearTimeout(toastTimer);toastTimer=setTimeout(()=>d.remove(),3600)}
function render(){const routes={dashboard:overview,pages,library,publish,calendar,reels,analytics,activity,settings};document.querySelector('#root').innerHTML=shell((routes[state.screen]||overview)());document.title=`${NAV.find(x=>x[0]===state.screen)?.[1]} | Facebook Reels Studio UI V2 (Mock)`}
window.addEventListener('hashchange',()=>{const k=location.hash.slice(1);if(NAV.some(x=>x[0]===k)&&k!==state.screen){state.screen=k;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal)closeModal();else if(state.drawer)closeDrawer()}});
render();
</script></body></html>
